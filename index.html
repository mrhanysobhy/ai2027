<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنصة التعليمية</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <!-- شاشة الدخول -->
  <div id="login-screen">
    <div class="login-card">
      <h1>مرحباً بك 👋</h1>
      <input type="text" id="code-input" placeholder="أدخل كودك الخاص" inputmode="numeric">
      <button class="btn" id="login-btn">دخول</button>
      <div class="error-text" id="login-error"></div>
    </div>
  </div>

  <!-- التطبيق الرئيسي (SPA) -->
  <div id="app-screen" class="hidden">
    <header>
      <div>أهلاً يا <strong id="welcome-name"></strong>!</div>
      <button class="btn secondary" id="logout-btn" style="width:auto;">تسجيل خروج</button>
    </header>
    <main>
      <div id="dashboard-view">
        <div id="subjects-grid" class="subjects-grid"></div>
      </div>
      <div id="exam-view" class="hidden"></div>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/exam.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
