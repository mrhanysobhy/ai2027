    <script>window.PAGE_DATA = {"type":"lesson","subjectId":"programming-ai","subject":{"id":"programming-ai","name":"البرمجة والذكاء الاصطناعي","icon":"fa-code","gradient":"linear-gradient(135deg, #d84315 0%, #ff8a65 100%)","description":"تعلم أساسيات البرمجة وتطبيقاتها في مجال الذكاء الاصطناعي"},"lessonId":1,"lesson":{"id":1,"title":"ما هي المعلومات؟","explanation":{"content":"<h2>ما هي المعلومات؟</h2>\n<div class=\"info-box\">\n    <p>في هذا الدرس سنتعرف على الفرق بين البيانات والمعلومات والمعرفة، وأنواع الوسائط التي تنقل المعلومات إلينا، بالإضافة إلى الأخلاقيات التي يجب مراعاتها عند التعامل مع المعلومات في عالم الإنترنت.</p>\n</div>\n\n<h3>أولاً: البيانات والمعلومات والمعرفة</h3>\n<table>\n    <tr><th>المصطلح</th><th>التعريف</th></tr>\n    <tr><td>البيانات (Data)</td><td>حقائق تُمثَّل باستخدام الأرقام أو الأحرف أو الرموز، بدون تحليل أو تفسير.</td></tr>\n    <tr><td>المعلومات (Information)</td><td>معنى أو قيمة تصل للمتلقي وتُستخدم لاتخاذ القرار. وعكس الأشياء المادية، ليس لها شكل أو كيان ثابت.</td></tr>\n    <tr><td>المعرفة (Knowledge)</td><td>المعلومات التي تم تحليلها وتنظيمها بشكل منهجي للمساعدة في حل المشكلات.</td></tr>\n    <tr><td>التحقق المتبادل (Cross-checking)</td><td>مقارنة المعلومات التي نحصل عليها من مصادر متعددة مع بعضها لتحديد مدى دقتها وموثوقيتها.</td></tr>\n</table>\n\n<h3>ثانياً: خصائص المعلومات</h3>\n<table>\n    <tr><th>الخاصية</th><th>الوصف</th></tr>\n    <tr><td><strong>الاستمرارية (Persistence)</strong></td><td>بمجرد إنشاء المعلومات، لا يمكن محوها بالكامل.</td></tr>\n    <tr><td><strong>قابلية التكرار (Reproducibility)</strong></td><td>إمكانية نسخ المعلومات بسهولة وبكميات كبيرة.</td></tr>\n    <tr><td><strong>الانتشار (Propagation)</strong></td><td>من السهل توصيل المعلومات ونشرها بسرعة عبر وسائل الإعلام الجماهيرية.</td></tr>\n</table>\n<div class=\"info-box\">\n    <p><strong>تذكّر:</strong> على عكس الأشياء المادية، المعلومات ليس لها شكل ملموس ثابت — وهذه هي أهم خاصية تُميزها.</p>\n</div>\n\n<h3>ثالثاً: المعلومات الأولية والثانوية</h3>\n<table>\n    <tr><th>النوع</th><th>التعريف</th><th>مثال</th></tr>\n    <tr><td>معلومات أولية (Primary)</td><td>يتم الحصول عليها من خلال التجربة الشخصية المباشرة أو البحث والتجارب.</td><td>تقارير التجارب، نتائج الاستطلاعات</td></tr>\n    <tr><td>معلومات ثانوية (Secondary)</td><td>لا تُحصَّل بشكل مباشر، بل من خلال طرف ثالث.</td><td>الكتب، الصحف، التلفزيون</td></tr>\n</table>\n\n<h3>رابعاً: الوسائط (Media)</h3>\n<p>الوسائط هي وسائل لنقل المعلومات إلى عدد من الأفراد.</p>\n<table>\n    <tr><th>النوع</th><th>المحتوى</th><th>مثال</th></tr>\n    <tr><td>وسائط الإعلام التعبيرية</td><td>وسيلة للتعبير عن المعلومات</td><td>النص، الصور، الصوت، الفيديو</td></tr>\n    <tr><td>وسائط النقل / الإرسال</td><td>وسيط لنقل وتبادل المعلومات</td><td>التلفزيون، الراديو، الصحف، الهاتف، الإنترنت</td></tr>\n    <tr><td>وسائط التسجيل</td><td>لتسجيل وتخزين المعلومات</td><td>الورق، أقراص USB، أقراص DVD، التخزين السحابي</td></tr>\n</table>\n<div class=\"warning-box\">\n    <strong>الثقافة الإعلامية (Media literacy)</strong>\n    <p>القدرة على تفسير المعلومات التي تم الحصول عليها من الوسائط بدقة.</p>\n</div>\n\n<h3>خامساً: أخلاقيات المعلومات (Information Ethics)</h3>\n<p>هي المفاهيم والتوجهات الأساسية اللازمة للقيام بأنشطة مناسبة في مجتمع المعلومات، بغض النظر عن وجود قوانين تُلزم بذلك أم لا.</p>\n<p><strong>نقاط يجب مراعاتها عند نشر المعلومات:</strong></p>\n<ul>\n    <li>لا يجوز مشاركة الصور أو مقاطع الفيديو التي يمتلكها الآخرون دون الحصول على إذن.</li>\n    <li>لا يجب تسريب المعلومات الشخصية لشخص آخر على الإنترنت.</li>\n    <li>لا يجوز مشاركة محتوى يحتفظ الآخرون بحقوق المؤلف (Copyright) عليه دون إذن.</li>\n    <li>لا يجب انتهاك خصوصية الآخرين.</li>\n    <li>لا يجب نشر تعليقات تشهير بالآخرين أو الانخراط في التنمر الإلكتروني (Cyber bullying).</li>\n</ul>\n<div class=\"warning-box\">\n    <strong>العلامة الجغرافية (Geotagging)</strong>\n    <p>معلومات تتضمن خطوط الطول والعرض مضمّنة تلقائيًا في الصور ومقاطع الفيديو الملتقطة بالهواتف الذكية، وقد تكشف عن موقع منزلك دون قصد.</p>\n</div>\n<div class=\"warning-box\">\n    <strong>المعلومات المضللة والشائعات</strong>\n    <p>معلومات كاذبة يتم نشرها عمدًا، أو شائعات لا أساس لها من الصحة.</p>\n</div>\n\n<h3>سادساً: المشاكل مع الهواتف الذكية ووسائل التواصل الاجتماعي</h3>\n<p>وسائل التواصل الاجتماعي (Social media) هي خدمات توفر منصات يمكن للأفراد من خلالها التواصل مع بعضهم البعض على الإنترنت.</p>\n<table>\n    <tr><th>المشكلة</th><th>التعريف</th></tr>\n    <tr><td>إدمان الإنترنت</td><td>الانغماس المفرط في الإنترنت لدرجة تعطيل الحياة اليومية.</td></tr>\n    <tr><td>استخدام الهاتف أثناء المشي</td><td>استخدام الهاتف الذكي أثناء المشي، وهو سلوك خطير.</td></tr>\n    <tr><td>الجريمة الإلكترونية</td><td>إساءة استخدام أجهزة الكمبيوتر والشبكات في أنشطة إجرامية.</td></tr>\n    <tr><td>انتحال الشخصية</td><td>قيام شخص بانتحال شخصية فرد أو مؤسسة لسرقة الهويات أو كلمات المرور.</td></tr>\n    <tr><td>تسريب المعلومات الشخصية</td><td>الكشف عن معلومات شخصية يجب أن تظل سرية لطرف ثالث.</td></tr>\n</table>\n<div class=\"success-box\">\n    <strong>أخلاقيات المعلومات في العمل</strong>\n    <p>قد تكون الرسومات الهندسية وبيانات الإنتاج سرية، لذا يجب عدم نشرها على وسائل التواصل الاجتماعي أو مشاركتها خارج الشركة دون إذن.</p>\n</div>"},"review":{"questions":[{"type":"mcq","question":"خاصية المعلومات التي تعني إمكانية نسخها بسهولة وبكميات كبيرة تسمى:","options":["الاستمرارية","قابلية التكرار","الانتشار","الثبات"],"correct":1,"explanation":"قابلية التكرار (Reproducibility) هي القدرة على نسخ المعلومات بسهولة وبكميات كبيرة."},{"type":"mcq","question":"الوسائط المستخدمة لتسجيل وتخزين المعلومات مثل أقراص USB والتخزين السحابي تسمى:","options":["وسائط تعبيرية","وسائط نقل/إرسال","وسائط تسجيل","وسائط أولية"],"correct":2,"explanation":"وسائط التسجيل تُستخدم لتسجيل المعلومات وتخزينها، مثل الورق والأقراص والتخزين السحابي."},{"type":"truefalse","question":"البيانات هي حقائق تُمثَّل باستخدام الأرقام أو الأحرف أو الرموز.","correct":true,"explanation":"هذا هو التعريف الدقيق للبيانات (Data): حقائق خام تُمثَّل بالرموز دون تفسير."},{"type":"truefalse","question":"للمعلومات شكل مادي وكيان ثابت مثل الأشياء الملموسة.","correct":false,"explanation":"على عكس الأشياء المادية، المعلومات ليس لها شكل أو كيان ثابت."},{"type":"truefalse","question":"بمجرد نشر معلومة على الإنترنت، من الصعب جدًا محوها بالكامل.","correct":true,"explanation":"هذه هي خاصية الاستمرارية (Persistence): بمجرد إنشاء المعلومات لا يمكن محوها بالكامل."},{"type":"truefalse","question":"المعلومات الثانوية يتم الحصول عليها من خلال التجربة الشخصية المباشرة.","correct":false,"explanation":"هذا تعريف المعلومات الأولية. أما الثانوية فتُؤخذ من طرف ثالث كالكتب والتلفزيون."},{"type":"mcq","question":"معلومات كاذبة يتم نشرها عمدًا أو شائعات لا أساس لها تسمى:","options":["العلامة الجغرافية","المعلومات المضللة والشائعات","الثقافة الإعلامية","البيانات الأولية"],"correct":1,"explanation":"هذا هو التعريف الدقيق للمعلومات المضللة والشائعات (Disinformation and rumors)."},{"type":"mcq","question":"عندما ينغمس شخص في الإنترنت بشكل مفرط لدرجة تعطيل حياته اليومية، يُسمى ذلك:","options":["الجريمة الإلكترونية","انتحال الشخصية","إدمان الإنترنت","التنمر الإلكتروني"],"correct":2,"explanation":"إدمان الإنترنت هو الانغماس المفرط في الإنترنت لدرجة تعطيل الحياة اليومية."},{"type":"mcq","question":"المعلومات التي يتم الحصول عليها من خلال التجربة الشخصية المباشرة أو البحث والتجارب تسمى معلومات:","options":["ثانوية","أولية","مضللة","تعبيرية"],"correct":1,"explanation":"المعلومات الأولية (Primary) هي التي تُحصل من التجربة الشخصية المباشرة أو البحث والتجارب."},{"type":"truefalse","question":"يجوز مشاركة صورة يملكها شخص آخر على الإنترنت دون إذنه ما دام الهدف تعليميًا.","correct":false,"explanation":"لا يجوز مشاركة صور أو مقاطع فيديو يملكها الآخرون دون الحصول على إذن، أيًا كان الغرض."},{"type":"truefalse","question":"الثقافة الإعلامية هي القدرة على تفسير المعلومات المستحصلة من الوسائط بدقة.","correct":true,"explanation":"هذا هو التعريف الدقيق للثقافة الإعلامية (Media literacy)."},{"type":"complete","question":"________ هي معنى أو قيمة تصل للمتلقي وتُستخدم لاتخاذ القرار.","answer":"المعلومات"},{"type":"complete","question":"عملية مقارنة المعلومات من مصادر متعددة لتحديد مدى دقتها وموثوقيتها تُسمى ________.","answer":"التحقق المتبادل"},{"type":"complete","question":"المعلومات التي يحصل عليها الشخص من خلال طرف ثالث كالكتب والتلفزيون تُسمى معلومات ________.","answer":"ثانوية"},{"type":"complete","question":"معلومات تتضمن خطوط الطول والعرض مضمّنة في الصور الملتقطة بالهواتف الذكية تُسمى ________.","answer":"العلامة الجغرافية"},{"type":"complete","question":"خدمات توفر منصات يمكن للأفراد من خلالها التواصل مع بعضهم البعض على الإنترنت تُسمى ________.","answer":"وسائل التواصل الاجتماعي"}]},"practiceExam":{"questions":[{"question":"ما المصطلح الذي يُطلق على الحقائق المُمثَّلة بالأرقام أو الأحرف أو الرموز؟","options":["المعرفة","البيانات","المعلومات","الوسائط"],"correct":1},{"question":"معلومات تم تحليلها وتنظيمها لحل المشكلات تُسمى:","options":["بيانات خام","المعرفة","معلومة كاذبة","وسيط نقل"],"correct":1},{"question":"خاصية «الانتشار» في المعلومات تعني:","options":["يمكن نسخها بسهولة","لا يمكن محوها كليًا","تنتقل بسهولة وسرعة عبر وسائل الإعلام","لها شكل مادي"],"correct":2},{"question":"مثال على وسائط النقل/الإرسال هو:","options":["الورق","التلفزيون","القرص الصلب","التخزين السحابي"],"correct":1},{"question":"القدرة على تفسير المعلومات المُستقاة من الوسائط بدقة تُسمى:","options":["أخلاقيات المعلومات","الثقافة الإعلامية","العلامة الجغرافية","التحقق المتبادل"],"correct":1},{"question":"مشاركة صورة يملكها شخص آخر دون إذنه تُعد مخالفة لـ:","options":["حقوق المؤلف","إدمان الإنترنت","الثقافة الإعلامية","الوسائط التعبيرية"],"correct":0},{"question":"معلومات خطوط الطول والعرض المضمّنة تلقائيًا في صور الهاتف الذكي تُسمى:","options":["حقوق الملكية","العلامة الجغرافية","المعلومات الثانوية","التحقق المتبادل"],"correct":1},{"question":"إساءة استخدام أجهزة الكمبيوتر والشبكات في أنشطة إجرامية تُسمى:","options":["انتحال الشخصية","الجريمة الإلكترونية","التنمر الإلكتروني","تسريب المعلومات"],"correct":1},{"question":"قيام شخص بانتحال هوية فرد آخر لسرقة كلمات المرور يُسمى:","options":["انتحال الشخصية","إدمان الإنترنت","الاستمرارية","الانتشار"],"correct":0},{"question":"أي العبارات التالية صحيحة بخصوص نشر المعلومات على الإنترنت؟","options":["يمكن نشر أي معلومة دون قلق لأنها ستختفي لاحقًا","يجب التأكد من عدم انتهاك خصوصية الآخرين قبل النشر","لا داعي للحصول على إذن لمشاركة صور الآخرين","النشر المجهول يعفي من المسؤولية"],"correct":1}]},"finalExam":{"availableFrom":"2026-09-17","availableTo":"2026-12-31T23:59","duration":30,"passScore":60,"questions":[{"question":"ما هو المصطلح الذي يطلق على الحقائق الخام التي يتم تمثيلها باستخدام الأرقام أو الحروف أو الرموز؟","options":["المعرفة","الوسائط","البيانات","المعلومات"],"correct":2,"hint":"فكر في المادة الأولية التي لم يتم تحليلها أو معالجتها بعد."},{"question":"تعتبر المعلومات الأولية هي تلك التي يحصل عليها الشخص من خلال تجربة مباشرة أو بحث شخصي.","options":["صح","خطأ"],"correct":0,"hint":"تذكر الفرق بين الحصول على المعلومة بنفسك أو عبر وسيط."},{"question":"أي من الخيارات التالية يندرج تحت فئة \"وسائط التسجيل\" (Recording media)؟","options":["محرك أقراص USB","الصور","الإنترنت","التلفزيون"],"correct":0,"hint":"ابحث عن الأداة التي تستخدم لحفظ المعلومات واسترجاعها لاحقاً."},{"question":"تعتبر الكتب والصحف والمجلات من مصادر المعلومات الثانوية.","options":["صح","خطأ"],"correct":0,"hint":"هل تحصل على المعلومات من هذه المصادر مباشرة عبر تجربة شخصية؟"},{"question":"خاصية المعلومات التي تعني إمكانية نشرها وتوصيلها بسهولة عبر وسائل الإعلام المختلفة تسمى:","options":["التحقق المتبادل","الانتشار","الاستمرارية","قابلية التكرار"],"correct":1,"hint":"فكر في كيفية وصول الأخبار إلى عدد كبير من الناس في وقت قصير."},{"question":"القدرة على تفسير المعلومات التي تم الحصول عليها من الوسائط بدقة تسمى \"الثقافة الإعلامية\".","options":["صح","خطأ"],"correct":0,"hint":"هذا المصطلح يرتبط بالوعي في التعامل مع ما يعرض في وسائل الإعلام."},{"question":"ما هو الخطر الرئيسي المرتبط بخاصية \"العلامة الجغرافية\" (Geotagging) عند نشر الصور؟","options":["فقدان جودة الصورة الأصلية","صعوبة نسخ الصورة وتكرارها","انتهاك حقوق الملكية الفكرية","كشف الموقع الدقيق لصاحب الصورة"],"correct":3,"hint":"فكر في البيانات المخفية التي تسجلها الهواتف الذكية حول مكان التقاط الصورة."},{"question":"تشير \"أخلاقيات المعلومات\" إلى المفاهيم الأساسية اللازمة للقيام بالأنشطة المناسبة في مجتمع المعلومات، بغض النظر عن وجود قوانين.","options":["صح","خطأ"],"correct":0,"hint":"هل المبادئ الأخلاقية تتوقف دائماً على ما تفرضه القوانين فقط؟"},{"question":"عندما يتم تنظيم المعلومات وتحليلها بشكل منهجي للمساعدة في اتخاذ القرارات وحل المشكلات، فإننا نصل إلى مستوى:","options":["المعرفة","المعلومات المضللة","وسائط الانتشار","البيانات الأولية"],"correct":0,"hint":"هذا هو أعلى مستوى في التسلسل الهرمي (بيانات - معلومات - ...)."},{"question":"لماذا تعد عملية \"التحقق المتبادل\" (Cross-checking) ضرورية عند التعامل مع المعلومات الثانوية؟","options":["لأن المعلومات الثانوية دائماً ما تكون أسرع في الوصول","لضمان بقاء المعلومات لفترة أطول على الإنترنت","لأن المعلومات الثانوية قد تختلف عن الأصلية أو تحتوي على تفسيرات مضافة","لتحويل الوسائط التعبيرية إلى وسائط تسجيل"],"correct":2,"hint":"فكر في التغييرات التي قد تطرأ على القصة عندما يرويها شخص عن شخص آخر."},{"question":"بمجرد نشر المعلومات الكاذبة أو الشائعات على الإنترنت، فإنه من الممكن حذفها نهائياً ومنع استمرارها.","options":["خطأ","صح"],"correct":0,"hint":"تذكر خاصية \"الاستمرارية\" (Persistence) للمعلومات الرقمية."},{"question":"ما هو المصطلح الذي يصف حالة الانغماس المفرط في الإنترنت لدرجة تؤدي إلى تعطيل الحياة اليومية؟","options":["التنمر الإلكتروني","إدمان الإنترنت","انتحال الشخصية","الجريمة الإلكترونية"],"correct":1,"hint":"يتعلق هذا المصطلح بعدم القدرة على التحكم في وقت استخدام الشبكة."},{"question":"يُسمح بنشر الرسومات الهندسية أو بيانات الإنتاج الخاصة بالعمل على وسائل التواصل الاجتماعي طالما أنها لا تضر بأحد مباشرة.","options":["صح","خطأ"],"correct":1,"hint":"فكر في مفهوم \"أخلاقيات المعلومات في العمل\" وسرية البيانات."},{"question":"أي من التصرفات التالية يعتبر تطبيقاً صحيحاً لأخلاقيات استخدام الهاتف الذكي؟","options":["إرسال البيانات الشخصية لغرباء تم التعرف عليهم إلكترونياً","استخدام الهاتف أثناء المشي في الأماكن المزدحمة","نشر صور المشاهير في الأماكن العامة دون إذنهم","إيقاف تشغيل الهاتف في أماكن مثل دور السينما أو المتاحف"],"correct":3,"hint":"ابحث عن السلوك الذي يظهر احتراماً للخصوصية والقواعد العامة."}]}}};</script>
