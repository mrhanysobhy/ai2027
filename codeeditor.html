<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ساحة الأكواد - HTML و CSS و JavaScript</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e1f26;--card:#2a2c36;--ed:#1e1f26;--line:#3a3d4a;--tx:#e6e8ef;--mu:#9aa0b3;--p:#6C63FF;--ok:#2ECC71;--er:#FF6B6B;--h:#ff7a3d;--c:#4da3ff;--j:#ffd93d;--fs:13px}
body.light{--bg:#eef0f6;--card:#fff;--ed:#fff;--line:#d5d9e6;--tx:#1b2030;--mu:#5b6378}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:15px;font-weight:800;margin:0 4px}
.sp{flex:1}
button{font:600 12px Cairo;border:1px solid var(--line);background:var(--bg);color:var(--tx);padding:5px 11px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--p)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--p)}
button.run{background:var(--ok);border-color:var(--ok);color:#06210f}
button.on{background:var(--p);border-color:var(--p);color:#fff}
header label{font-size:12px;color:var(--mu);display:flex;gap:4px;align-items:center}
#info{background:var(--card);border-bottom:1px solid var(--line);padding:6px 14px;font-size:13px;line-height:1.8;max-height:32vh;overflow:auto}
#info summary{cursor:pointer;font-weight:800;font-size:14px}
.app{flex:1;display:grid;grid-template-columns:250px 1fr;min-height:0}
body.nosb .app{grid-template-columns:0 1fr}
aside{background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:8px;font-size:13px}
body.nosb aside{padding:0;overflow:hidden;border:0}
.bar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;margin:4px 4px 8px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
aside h3{font-size:12px;margin:10px 4px 4px;padding-right:7px;border-right:3px solid var(--g)}
.it{display:flex;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer}
.it:hover{background:var(--bg)}
.it.on{background:var(--p);color:#fff}
.it b{font-size:11px;opacity:.7;min-width:18px}
.it em{margin-right:auto;font-style:normal}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.ed{display:flex;height:48%;min-height:100px}
.pn{flex:1;display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line)}
.ph{padding:3px 12px;font:700 12px 'Fira Code',monospace;background:var(--card);border-top:3px solid var(--g);direction:ltr}
.cw{position:relative;flex:1;min-height:0;font-size:var(--fs)}
.cw pre,.cw textarea{position:absolute;inset:0;margin:0;padding:10px;border:0;font:inherit;line-height:1.6;font-family:'Fira Code',monospace;white-space:pre;overflow:auto;direction:ltr;text-align:left;tab-size:2;letter-spacing:0}
.cw pre{pointer-events:none;overflow:hidden;color:var(--tx);background:var(--ed)}
.cw textarea{z-index:1;resize:none;background:transparent;color:transparent;caret-color:var(--tx)}
.cw textarea::selection{background:rgba(108,99,255,.45)}
.cw i{font-style:normal}.m{color:#7d869c;font-style:italic}.s{color:#9ece6a}.n{color:#ff9e64}.k{color:#bb9af7}.t{color:#f7768e}.a{color:#e0af68}.p{color:#7aa2f7}
#spl{height:7px;background:var(--line);cursor:row-resize;flex:none;touch-action:none}
.rs{flex:1;display:flex;flex-direction:column;min-height:80px;background:#fff}
.tabs{display:flex;gap:4px;align-items:center;padding:4px 8px;background:var(--card);border-bottom:1px solid var(--line)}
#res{flex:1;font-size:13px;font-weight:600;padding-right:10px}
.good{color:var(--ok)}.bad{color:var(--er)}
#pv{flex:1;border:0;width:100%;background:#fff}
#log{flex:1;display:none;background:var(--bg);padding:10px;font:13px/1.8 'Fira Code',monospace;overflow:auto;direction:ltr;text-align:left;white-space:pre-wrap}
#log .error{color:var(--er)}#log .warn{color:var(--j)}#log .ar{direction:rtl;text-align:right;color:var(--j)}
footer{flex:none;display:flex;flex-wrap:wrap;gap:2px 0;justify-content:center;align-items:center;padding:8px 14px;background:var(--card);border-top:1px solid var(--line);font-size:11.5px;line-height:1.7;color:var(--mu);direction:ltr}
footer b{color:var(--tx);font-weight:700;position:relative}
footer b::after{content:"";position:absolute;inset:auto 0 -2px;height:1.5px;border-radius:2px;background:var(--p);opacity:.75}
footer i{font-style:normal;opacity:.4;margin:0 8px}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:fixed;inset:0 0 0 20%;z-index:5;box-shadow:-4px 0 20px #0008}body.nosb aside{display:none}main{overflow:auto}.ed{flex-direction:column;height:auto!important}.pn{min-height:140px}#spl{display:none}.rs{min-height:300px}footer{font-size:10.5px;padding:6px 10px}footer i{margin:0 5px}}
</style>
</head>
<body>
<header>
<button type="button" onclick="document.body.classList.toggle('nosb')" aria-label="قائمة الدروس">☰ الدروس</button>
<h1>⌨️ ساحة الأكواد</h1><span class="sp"></span>
<button type="button" id="bEx" onclick="tog('ex')">📖 المثال</button><button type="button" id="bTk" onclick="tog('tk')">✏️ التمرين</button>
<button type="button" class="run" onclick="run()">▶ تشغيل</button>
<label><input type="checkbox" id="auto" checked> تشغيل تلقائي</label>
<button type="button" onclick="reset()">↺ إعادة</button>
<button type="button" id="bSol" onclick="sol()" style="display:none">💡 الحل</button>
<button type="button" id="bNext" class="run" onclick="next()" style="display:none">⏭ التالي</button>
<button type="button" onclick="dl()" aria-label="تنزيل الصفحة">⬇ تنزيل</button>
<button type="button" onclick="fs(1)" aria-label="تكبير الخط">A+</button><button type="button" onclick="fs(-1)" aria-label="تصغير الخط">A−</button>
<button type="button" onclick="theme()" aria-label="المظهر">🌓</button>
</header>
<details id="info" open><summary>جارٍ التحميل…</summary></details>
<div class="app">
<aside id="side"></aside>
<main id="mn">
<div class="ed" id="edw">
<div class="pn" style="--g:var(--h)"><div class="ph">HTML</div><div class="cw"><pre></pre><textarea id="h" spellcheck="false" aria-label="HTML"></textarea></div></div>
<div class="pn" style="--g:var(--c)"><div class="ph">CSS</div><div class="cw"><pre></pre><textarea id="c" spellcheck="false" aria-label="CSS"></textarea></div></div>
<div class="pn" style="--g:var(--j)"><div class="ph">JS</div><div class="cw"><pre></pre><textarea id="j" spellcheck="false" aria-label="JavaScript"></textarea></div></div>
</div>
<div id="spl"></div>
<div class="rs">
<div class="tabs"><button type="button" id="tR" class="on" onclick="stab('result')">النتيجة</button><button type="button" id="tC" onclick="stab('console')">Console (0)</button><span id="res"></span></div>
<iframe id="pv" sandbox="allow-scripts" title="النتيجة"></iframe><div id="log"></div>
</div>
</main>
</div>
<footer>Created by: <b>Mr. Hany Sobhy</b><i>|</i>El-Bawiti Commercial Secondary School<i>|</i>Bahariya Oasis Directorate of Education</footer>
<script>
const G=[['HTML','var(--h)'],['CSS','var(--c)'],['JavaScript','var(--j)']];
// [المجموعة، العنوان، الشرح، المثال، نص التمرين، كود البداية، الفحص]
const L=[
[0,'لغة HTML: العناوين والفقرات','HTML اختصار Hyper Text Markup Language، وهي لغة ترميز تُستخدم لبناء الهيكل الأساسي لصفحات الويب وإضافة المحتوى مثل النصوص والصور. والوسوم من h1 إلى h6 للعناوين، والوسم p للفقرات.',
`<h1> Welcome to My Website </h1>\n<p> This is a paragraph about programming. </p>`,
'اكتب عنواناً h1 وفقرة p تحتوي على نص عن البرمجة.','',[/<h1\s*>[\s\S]*?<\/h1>/,/<p\s*>[\s\S]*?<\/p>/]],
[0,'القوائم في HTML (Lists)','القائمة غير المرقمة (Unordered List) هي ul، والقائمة المرقمة (Ordered List) هي ol، وكل عنصر بداخلها يُكتب بالعلامة li.',
`<ul>\n  <li>HTML</li>\n  <li>CSS</li>\n  <li>JavaScript</li>\n</ul>`,
'أنشئ قائمة غير مرقمة ul فيها ثلاثة عناصر li.','',[/<ul>(\s*<li>[\s\S]*?<\/li>){3}\s*<\/ul>/]],
[0,'عرض الصور في HTML (Images)','الوسم img مع الخاصية src وهي مصدر الصورة ومسارها، و alt وهي النص البديل الذي يظهر إذا تعذر تحميل الصورة، و width لتحديد العرض بالبكسل. ولاحظ أن الصورة لا تظهر إلا إذا كان ملف الصورة موجوداً فعلاً في المسار المكتوب داخل src بالضبط، فإن كان المسار خاطئاً أو الملف غير موجود ظهرت علامة صورة مكسورة بدلها.',
`<img src="logo.png" alt="Company Logo" width="200">`,
'أضف صورة لها السمات src و alt و width، وتأكد أن ملف الصورة موجود في المسار الذي كتبته داخل src.','',[/<img[^>]*src=["'][^"']+["']/,/<img[^>]*alt=["'][^"']+["']/,/<img[^>]*width=["']\d+["']/]],
[0,'التعليقات في HTML','التعليق في HTML يوضع بين علامتي التعليق ولا يظهر للمستخدم في المتصفح، وفائدته توضيح وظيفة الكود وتنظيمه.',
`<!-- صورة شعار الموقع -->\n<img src="logo.png" alt="Company Logo" width="200">`,
'اكتب تعليقاً في كود HTML يسبق صورة لها السمتان src و alt.','',[/<!--[\s\S]*?-->/,/<img[^>]*src=/,/<img[^>]*alt=/]],
[1,'لون الحروف في CSS (Color)','خاصية color تغيّر لون النص. ونكتبها إما مباشرة داخل السمة style في وسم p أو h1، أو في كتلة style منفصلة. ويمكن استخدام أسماء الألوان مباشرة أو الأكواد السداسية مثل #0000FF.',
`<p style="color: red;">هذا نص لونه أحمر</p>\n<h1 style="color: blue;">Blue Title</h1>\n<p style="color: #0000FF;">هذا نص لونه أزرق</p>`,
'لوّن فقرة p بلون أحمر باستعمال السمة style داخل الوسم.','<p style="color: ;">نص</p>',[/<p[^>]*style=["'][^"']*color\s*:\s*(red|#f00|#ff0000)/i]],
[1,'سماكة وحجم الأحرف في CSS','font-size لتحديد حجم الخط بالبكسل مثل 20px، و font-weight لتحديد سماكة الخط مثل bold.',
`<p style="font-size: 20px;">هذا نص بحجم خط 20 بكسل</p>\n<p style="font-size: 20px; font-weight: bold;">Big and Bold Text</p>`,
'اجعل نصاً بحجم 20px وسماكة bold باستعمال السمة style داخل الوسم.','<p style="font-size: ;">نص</p>',[/<p[^>]*style=["'][^"']*font-size\s*:\s*\d+px/i,/<p[^>]*style=["'][^"']*font-weight\s*:\s*bold/i]],
[1,'الفئة في CSS (Class)','الفئة تطبق نفس التنسيق على مجموعة عناصر: نبدأ اسمها بنقطة مثل .my-style داخل وسم style، ثم نستخدم الخاصية class في كود HTML.',
`<p class="my-style">Hello World</p>\n\n<style>\n.my-style {\n  color: green;\n  font-size: 18px;\n}\n</style>`,
'أنشئ فئة اسمها note تطبق تنسيقاً، وطبّقها على فقرة واحدة.','<style>\n\n</style>\n<p class="note">نص</p>',[/\.note\s*\{[^}]*\S[^}]*\}/,/class=["']note["']/]],
[1,'التعليقات في CSS','تعليق CSS يُكتب بين العلامتين /* و */ ويتجاهله المتصفح تماماً، ويُستخدم لشرح مجموعة خصائص.',
`<style>\n/* هذا تعليق في ملف CSS */\np {\n  color: blue;\n  font-size: 20px;\n}\n</style>\n<p>نص</p>`,
'اكتب تعليقاً في CSS داخل وسم style، ونسّق العنصر p بلون.','<style>\n\n</style>\n<p>نص</p>',[/\/\*[\s\S]*?\*\//,/p\s*\{[^}]*color\s*:/i]],
[2,'مقدمة في البرمجة ولغة JavaScript','البرمجة إعطاء أوامر وتعليمات للكمبيوتر بلغة يفهمها لتنفيذ مهمة. أما الويب فله ثلاث لغات: HTML للهيكل، و CSS للتنسيق، و JavaScript لإضافة التفاعل. ونكتب كود JavaScript في محرر أكواد مثل Visual Studio Code، أو داخل وسم script في ملف HTML، ونطبع النتائج في وحدة التحكم Console.',
`console.log('Welcome to the world of programming');`,
'اطبع النص Welcome to the world of programming باستعمال console.log.','','Welcome to the world of programming'],
[2,'طباعة أول كود والتعليقات','نفتح المتصفح ونضغط F12 ونختار تبويب Console، ونستخدم console.log لعرض جملة أو نتيجة حسابية. والتعليق سطر واحد بـ // أو متعدد الأسطر بين /* و */ لا ينفذه الحاسوب بل يُستخدم للشرح.',
`// طباعة رسالة\nconsole.log("مرحبا بك في عالم JavaScript");`,
'اكتب تعليقاً بـ // وآخر بـ /* */ ثم اطبع النص تم.','','تم'],
[2,'المتغيرات let و const','المتغير مكان في الذاكرة يُستخدم لتخزين البيانات والوصول إليها لاحقاً. و let متغير قابل للتغيير، و const قيمة ثابتة لا تتغير. ويبدأ اسم المتغير بحرف أو شريحة سفلية وبدون مسافات، والأحرف الكبيرة والصغيرة تفرق.',
`let age = 16;\nconst school = "High School";\n\nconsole.log(age, school);`,
'عرّف let باسم age قيمتها 16، و const باسم school قيمتها "High School"، ثم اطبعهما معاً.','','16 High School'],
[2,'أنواع البيانات والفحص بـ typeof','أنواع البيانات: نصوص String، وأعداد Number، ومنطقية Boolean، وغير معرّفة Undefined، وقيمة فارغة Null، ومصفوفات Arrays، وكائنات Objects. ونفحص نوع أي قيمة بالمعامل typeof.',
`let name = "Adam";\nlet score = 95;\nlet isPassed = true;\n\nconsole.log(typeof score);`,
'اطبع ناتج typeof للنص "مرحبا".','','string'],
[2,'الثوابت و undefined و null','محاولة تغيير قيمة متغير عُرّف بـ const تحدث خطأ TypeError وقت التنفيذ. و undefined هي القيمة غير المعرفة أي أن المتغير مُعرّف ولم تُسند له قيمة، أما null فهي عدم وجود قيمة قصداً. ولا يمكن أن يبدأ اسم المتغير برقم.',
`const gravity = 9.8;\nlet notAssigned;\nlet empty = null;\nlet isRaining = true;\n\nconsole.log(typeof notAssigned, notAssigned);\nconsole.log(typeof empty, empty);\nconsole.log(isRaining);`,
'عرّف let باسم x بدون إسناد قيمة، و const باسم y قيمتها null، ثم اطبع typeof لكل منهما.','','undefined undefined\nobject null'],
[2,'دمج النصوص (String Concatenation)','النصوص كلمات بين علامات تنصيص مفردة أو مزدوجة، ولربط نصين أو أكثر نستخدم علامة الجمع +.',
`console.log("مرحباً" + " " + "بالعالم");\n\nlet name = "أحمد";\nconsole.log("أهلاً " + name);\n\nconsole.log("المكتملة" + " " + "الجملة");`,
'عرّف let باسم firstName قيمتها عمر، و let باسم lastName قيمتها أحمد، ثم اطبعهما معاً بينهما مسافة.','','عمر أحمد'],
[2,'العمليات الحسابية الأساسية','العمليات الحسابية الأساسية هي الجمع + والطرح - والضرب * والقسمة / وباقي القسمة %.',
`console.log(10 + 5);\nconsole.log(20 - 8);\nconsole.log(4 * 3);\nconsole.log(15 / 3);\nconsole.log(10 % 3);`,
'اطبع ناتج عملية 12 % 5.','','2'],
[2,'دمج الأعداد والنصوص','عند جمع رقم مع نص تقوم JavaScript بتحويل الرقم إلى نص ودمجهما في جملة واحدة دون عملية حسابية، أما الضرب والطرح فيحوّلان النص إلى رقم أولاً.',
`console.log("العدد هو: " + 5);\nconsole.log(10 + "20");`,
'اطبع ناتج جمع العدد 5 مع النص " تفاحات ".','','5 تفاحات'],
[2,'تمارين الأعداد والنصوص والمتغيرات','نجمع ما تعلمناه: دمج النصوص بعلامة +، والحساب على المتغيرات، وتغيير قيمة المتغير بإسناد جديد.',
`let firstName = 'عمر';\nlet lastName = 'أحمد';\nconsole.log(firstName + ' ' + lastName);\n\nconst greeting = 'صباح الخير';\nconst user = 'سارة';\nconsole.log(greeting + '، ' + user);`,
'عرّف let باسم x قيمتها 15، ثم اطبع قيمتها بعد طرح 3 منها.','','12'],
[2,'أنواع التصريح let و const و var','let متغيرات يمكن تغيير قيمتها، و const متغيرات ثابتة لا يمكن تغيير قيمتها بعد الإسناد الأولي، و var هي المتغيرات القديمة. وكلاهما ذات نطاق كتلة بين الأقواس المعقوفة، و var ذات نطاق دالة، ويُنصح باستخدام let و const.',
`let age;\nage = 25;\nlet score = 100;\nconst school = "High School";\n\nconsole.log(age, score, school);`,
'عرّف let باسم count قيمتها 10، و const باسم pi قيمتها 3.14، ثم اطبعهما معاً.','','10 3.14'],
[2,'العمليات على المتغيرات و camelCase','نستطيع جمع متغيرين في متغير جديد، ودمج متغيرين نصيين، ثم طباعة النتيجة. ونفضل تسمية المتغيرات بطريقة camelCase مثل firstName.',
`let x = 5, y = 10;\nlet sum = x + y;\n\nlet firstName = "علي", lastName = "حسن";\nlet fullName = firstName + " " + lastName;\n\nconsole.log("النتيجة هي: " + sum);\nconsole.log(fullName);`,
'عرّف let باسم firstName قيمتها مريم، و let باسم lastName قيمتها علي، ثم اطبعهما معاً في متغير اسمه fullName.','','مريم علي'],
[2,'صحة أسماء المتغيرات','يبدأ اسم المتغير بحرف أو شريحة سفلية ولا يحتوي مسافات. فـ $price صحيح، و user_name صحيح، أما 1stPlace خطأ لأنه يبدأ برقم، و my-variable غير مستحسن لأنه يُفهم كعلامة طرح.',
`let $price = 100;\nlet user_name = "Ali";\n\nconsole.log($price, user_name);`,
'عرّف let باسم $score قيمتها 90، و let باسم user_name قيمتها sara، ثم اطبعهما معاً.','','90 sara'],
[2,'التحويل الضمني للأنواع (Type Coercion)','في العمليات الحسابية تحوّل JavaScript النص إلى رقم تلقائياً، أمّا علامة الجمع مع نص فتدمجهما كنصين. مثال: حاصل ضرب النص 5 في 3 يساوي 15، وجمع النص 5 مع الرقم 3 يساوي 53، وطرح النص 10 من النص 2 يساوي 8.',
`console.log('5' * 3);\nconsole.log('5' + 3);\nconsole.log('10' - '2');`,
"اطبع ناتج ضرب النص '7' في العدد 2.",'','14'],
[2,'أنواع البيانات الأساسية المتقدمة','الأنواع الأساسية هي Number مثل 42 و -3.14 و 1e6، و String مثل النصوص، و Boolean مثل true و false، و Object مثل كائن له خصائص، و Array مثل قائمة قيم بين أقواس معقوفة.',
`let age = 25;\nlet name = "أحمد";\nlet isStudent = true;\nlet user = { id: 5, role: "admin" };\nlet colors = ["أزرق", "أحمر"];\n\nconsole.log(typeof age, typeof name, typeof isStudent, typeof user, typeof colors);`,
