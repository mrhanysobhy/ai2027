ault}.tx,select{font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:6px 10px}.tx{width:100%;margin-top:10px}.mt{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-top:10px}.mt1{margin-top:10px}.mr{display:flex;gap:10px;align-items:center;margin-bottom:6px}.btn{font:inherit;border:2px solid var(--ac);background:none;color:var(--ac);border-radius:10px;padding:5px 18px;cursor:pointer;margin-top:10px;font-weight:700}.btn.pri{background:var(--ac);color:var(--onac)}.fb{margin-top:8px;font-weight:700}.qc.ok .fb{color:var(--ok)}.qc.no .fb{color:var(--no)}.qc .fb.info{color:var(--mut)}.res{text-align:center;background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:18px;margin-top:18px}.pc{font-size:2.4em;font-weight:800;color:var(--ac)}.mh{font-size:.8em;color:var(--mut);margin-top:2px}@media(max-width:560px){.mt{grid-template-columns:1fr}}</style></head><body><main id="app"></main><script>var norm=function norm(s){

e)"],"c":[1]},{"t":"mcq","q":"قام فريق من المخترقين باختراق موقع حكومي ونشر بيانات اعتراضا على سياسة معينة دون المطالبة بأي مبالغ مالية. يُصنف هؤلاء المخترقون ضمن:","img":"","o":["المخترقين الحقوقيين (Hacktivists)","المجرمين الإلكترونيين التقليديين (Cyber Criminals)","مخترقي القبعة البيضاء (White-Hat Hackers)","المخترقين المجندين دولياً (State-sponsored Attackers)"],"c":[0]},{"t":"mcq","q":"أيٌّ من المخاطر الآتية يُصنف ضمن **المخاطر السبرانية على المستوى الاستراتيجي** وليس التشغيلي؟","img":"","o":["مخاطر تزايد حجم وشدة الانتهاكات ومخاطر الشفافية أمام المستثمرين.","مخاطر سرقة ملفات التعريف والارتباط (Cookies) الخاصة بالمستخدم.","مخاطر فك تشفير البيانات المنقولة عبر الشبكات المباشرة.","مخاطر الاعتماد على البرامج مفتوحة المصدر في تحسين الشفرات."],"c":[0]},{"t":"mcq","q":"ما السبب الرئيسي الذي يجعل مخاطر الهندسة الاجتماعية (Social Engineering) شائعة وخطيرة جداً في العالم الرقمي؟","img":"","o":["قدرتها الفائقة على تعطيل الخوادم الرئيسية دون التفاعل مع المستخدمين.","اقتصار استهدافها على برمجيات تشغيل الهواتف الذكية الحديثة فقط.","استخدامها لمعادلات رياضية معقدة لفك تشفير المحافظ الرقمية.","اعتمادها على التلاعب الخادع بالعامل البشري لاستغلال ثقة الأشخاص واستخلاص معلومات حساسة."],"c":[3]},{"t":"mcq","q":"تهدف سرقة ملفات التعريف والارتباط (Cookies) على متصفح المستخدم بشكل مباشر إلى:","img":"","o":["الحصول على معلومات جلسة الدخول والأرقام السرية للوصول لصفحات المستخدم الشخصية.","التسبب في إيقاف خدمات معالجة المكونات الهاردويرية.","إحداث تلف مادي في قرص التخزين الصلب للحاسوب.","إعادة توجيه اتصالات الشبكة اللاسلكية لموزع آخر."],"c":[0]},{"t":"mcq","q":"عند تصفح موقع إلكتروني يتطلب إدخال بيانات بطاقة الائتمان، كيف يمكنك التأكد من أن الاتصال بالموقع مشفر وآمن؟","img":"","o":["التأكد من أن عنوان URL للموقع يبدأ بـ https بدلاً من http.","التأكد من إغلاق جميع النوافذ المنبثقة والإعلانات.","استخدام برامج الحماية من هجمات القوة الغاشمة فقط.","التحقق من تنزيل ملفات الكوكيز تلقائياً بدون استئذان."],"c":[0]},{"t":"mcq","q":"ما الفائدة الرئيسية من تطبيق نظام المصادقة الثنائية (Two-Factor انية بسبب سهولة تخزينها ونقلها وإمكانية إجراء المعاملات عبر الشبكة المظلمة الـ ___.","img":"","a":["Dark Web"]},{"t":"fill","q":"ناقش خطورة الاعتماد على البرامج مفتوحة المصدر (Open-Source Software) من الناحية الأمنية التشغيلية في المؤسسات.","img":"","a":["تكمن الخطورة في أن الشفرة المصدرية متاحة للجميع، مما يتيح للمخترقين دراستها بتمعن لاكتشاف الثغرات الأمنية الخفية واستغلالها قبل أن يتم ترقيعها، إضافة إلى احتمالية دمج مكتبات برمجية ضارة من قبل مطورين غير موثوقين."]},{"t":"fill","q":"يُوصى عند استخدام شبكات Wi-Fi العامة بتثبيت شبكة افتراضية خاصة تُعرف بـ ___ لتشفير البيانات المرسلة عبر الاتصال.","img":"","a":["VPN"]},{"t":"fill","q":"بين الفرق الأساسي بين المصادر الداخلية والمصادر الخارجية للمخاطر السبرانية، مع ذكر مثال واحد لكل منهما.","img":"","a":["المصادر الداخلية تنشأ من داخل المؤسسة (مثل الأخطاء البشرية للموظفين أو التسريب الداخلي)، بينما المصادر الخارجية تأتي من خارج المؤسسة والبيئة المحيطة (مثل الهجمات السيبرانية الخارجية والفيروسات وبرمجيات الفدية)."]}]}]},norm);</script></body></html>
