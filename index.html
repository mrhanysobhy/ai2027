<body>

<header id="H"></header>

<main id="app"></main>

<div id="mod" class="modal" onclick="if(event.target===this)closeLogin()">
  <div class="card">
    <h3>🔐 تسجيل دخول الطالب</h3>
    <input id="code" class="inp" style="width:100%" inputmode="numeric" maxlength="6"
           placeholder="كود الدخول (6 أرقام)"
           oninput="this.value=this.value.replace(/\D/g,'')"
           onkeydown="if(event.key=='Enter')doLogin()">
    <p class="mu" style="font-size:.85rem">الكود يُوزَّع من إدارة المدرسة أو من المعلم.</p>
    <div class="row">
      <button class="btn p" onclick="doLogin()">دخول</button>
      <button class="btn" onclick="closeLogin()">إلغاء</button>
    </div>
  </div>
</div>

<footer>
  <div>🎓 مدرسة الباويطي الثانوية التجارية | AI Pioneers</div>
  <div>AI Pioneers © 2026 جميع الحقوق محفوظة</div>
</footer>
