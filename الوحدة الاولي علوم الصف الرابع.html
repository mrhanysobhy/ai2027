};(function quizRuntime(D,norm){

باتات الصحراوية بامتلاكها أوراقاً عريضة جداً وكبيرة الحجم لمساعدتها على البقاء.","img":"","a":false},{"t":"tf","q":"تساعد الآذان الكبيرة لثعلب الفنك في السماح بخروج حرارة الجسم الزائدة للحفاظ على برودته.","img":"","a":true},{"t":"tf","q":"دفن خنفساء الروث للروث داخل التربة يؤدي إلى تراجع خصوبة التربة الزراعية.","img":"","a":false},{"t":"tf","q":"العدسة المكبرة هي الأداة التي تساعدنا على رؤية التفاصيل الدقيقة الواضحة لأجزاء الحشرات الصغيرة.","img":"","a":true},{"t":"tf","q":"يمتلك اليربوع أرجلاً خلفية قصيرة للغاية تساعده على التخفي أوقات الخطر.","img":"","a":false},{"t":"tf","q":"الموطن الطبيعي لقط الرمال هو الحدائق والمناطق الزراعية الحضرية.","img":"","a":false},{"t":"tf","q":"يُعرف الموطن الطبيعي بأنه المكان الذي يعيش فيه الكائن الحي وتتوافر فيه احتياجاته الأساسية كالمياه والغذاء.","img":"","a":true},{"t":"tf","q":"يُفضل استخدام الألوان والظلال الكثيفة عند إعداد الرسوم التوضيحية العلمية للكائنات الحية لإظهار جمالها.","img":"","a":false},{"t":"tf","q":"تُساعد الأوراق الكبيرة العريضة النباتات الصحراوية على الاحتفاظ بالماء وتقليل التبخر في البيئات الجافة.","img":"","a":false},{"t":"tf","q":"يمتلك ثعلب الفنك آذاناً كبيرة تُسهم في طرد الحرارة الزائدة من جسمه والتكيف مع حرارة الصحراء.","img":"","a":true},{"t":"tf","q":"يُعد تحريك كرات الروث بواسطة خنفساء الروث سلوكاً عشوائياً لا يتأثر بأي مؤشرات خارجية في البيئة.","img":"","a":false},{"t":"tf","q":"تتشابه جميع البيئات في خصائصها، مما يسمح للكائنات الحية بالانتقال للعيش في أي موطن دون الحاجة لتكيفات خاصة.","img":"","a":false},{"t":"tf","q":"يُمكن تصنيف الثعابين والحيتان في مجموعة واحدة بناءً على خاصية عدم وجود الأرجل.","img":"","a":true},{"t":"tf","q":"تمتلك جذور نبات السنط نمواً سطحياً قريباً جداً من سطح الأرض لامتصاص قطرات الندى الصباحية فقط.","img":"","a":false},{"t":"tf","q":"يستطيع الضفدع العيش والتكاثر بنجاح في البيئات الصحراوية الجافة شديدة الحرارة.","img":"","a":false},{"t":"tf","q":"يعتمد اليربوع الصحراوي على الشرب المباشر اليومي من البرك والمجاري المائية لتلبية احتياجاته من الماء.","img":"","a":false},{"t":"tf","q":"يُمكن رؤية تفاصيل الشُّعيرات الصغيرة ومفاصل أرجل الحشرات بوضوح عند استخدام العدسة المكبرة مقارنة بالعين المجردة.","img":"","a":true},{"t":"tf","q":"تنشط معظم الحيوانات الصحراوية خلال فترة الظهيرة للاستفادة من أشعة الشمس المباشرة.","img":"","a":false},{"t":"tf","q":"يُعد نبات البردي ونبات اللوتس من النباتات التي تتكيف مع البيئات المائية والرطبة كالمستنقعات وضفاف النيل.","img":"","a":true},{"t":"tf","q":"يمكن تصنيف الكائنات الحية بناءً على صفات ظاهرة مثل اللون أو الشكل أو الحجم.","img":"","a":true},{"t":"tf","q":"ينبغي التحديق المباشر في الشمس باستخدام العدسة المكبرة لرؤية الكائنات الحية الدقيقة المعلقة في الهواء.","img":"","a":false},{"t":"tf","q":"يُعتبر قط الرمل من الحيوانات التي تستوطن البيئات الزراعية والغابات المطيرة الرطبة.","img":"","a":false},{"t":"tf","q":"تعتبر عمليات التغذية، التنفس، النمو، والتكاثر من الخصائص الأساسية التي تميز الكائنات الحية عن الأشياء غير الحية.","img":"","a":true},{"t":"tf","q":"تستمد السحالي حرارة أجسامها أحياناً عن طريق الجلوس مباشرة على الصخور الساخنة.","img":"","a":true},{"t":"tf","q":"عند فحص جسم ثابت في الطبيعة باستخدام العدسة المكبرة، يلزم تحريك الجسم نفسه للأمام والخلف للحصول على صورة واضحة.","img":"","a":false},{"t":"tf","q":"يُحظر النظر مباشرة إلى أشعة الشمس باستخدام العدسة المكبرة لأن ذلك يسبب خطراً شديداً على العين.","img":"","a":true},{"t":"tf","q":"يُفضل تظليل الرسم التوضيحي بكثافة عند إعداد بطاقة تسجيل الملاحظات لإظهار تفاصيل الكائن بشكل أفضل.","img":"","a":false},{"t":"tf","q":"أول خطوة يجب كتابتها في أعلى بطاقة تسجيل الملاحظات هي عنوان الموضوع.","img":"","a":true},{"t":"tf","q":"تعتمد عملية تصنيف الكائنات الحية على مظهرها الخارجي فقط مثل اللون ولا يمكن التصنيف بحسب الموطن أو الحجم.","img":"","a":false},{"t":"tf","q":"تمتلك شجرة السنط أوراقاً كبيرة وعريضة جداً لتساعدها على التقاط أكبر قدر من مياه الأمطار الصحراوية.","img":"","a":false},{"t":"tf","q":"تنمو جذور شجرة السنط بشكل عميق وممتد تحت سطح الأرض للوصول إلى أعماق المياه الجوفية.","img":"","a":true},{"t":"tf","q":"تستطيع الضفادع الانتقال بسهولة والعيش والتكاثر في أعماق الصحراء الجافة شديدة الحرارة.","img":"","a":false},{"t":"tf","q":"تتميز بيئة ضفاف نهر النيل بوفرة المياه والتربة الطينية الرطبة التي تناسب نمو نباتات مثل زهرة اللوتس والبردي.","img":"","a":true},{"t":"tf","q":"يمتلك اليربوع أرجلاً خلفية طويلة تمكنه من القفز السريع والابتعاد فوراً عن الحرارة والرمال الساخنة.","img":"","a":true},{"t":"tf","q":"يُعتبر تغير لون أو شكل الكائن الحي ليتناسب مع بيئته نوعاً من التكيف الذي يساعده على البقاء والعيش.","img":"","a":true},{"t":"tf","q":"تتميز حشرة خنفساء الروث بأرجل خلفية طويلة تحور شكلها لمساعدتها على تدحرج كرات الروث.","img":"","a":true},{"t":"tf","q":"يمكن تصنيف السحلية والعنكبوت في مجموعة واحدة من حيث الشكل بناءً على امتلاك كلينا لثماني أرجل.","img":"","a":false},{"t":"tf","q":"يعيش طائر أبو قردان والهدد بشكل أساسي في الحدائق والأراضي الزراعية القريبة من دلتا ونهر النيل.","img":"","a":true},{"t":"tf","q":"ينمو نبات الحنظل بشك طبيعي في البيئات المائية الشديدة الرطوبة على ضفاف النيل.","img":"","a":false},{"t":"tf","q":"عند رسم كائن حي في بطاقة تسجيل الملاحظات، يُنصح باستخدام الخيال ورسم أجزاء قد لا نراها لجعل الصورة مكتملة.","img":"","a":false},{"t":"tf","q":"تُعتبر المواد المشتقة من الكائنات الحية كالأخشاب والجلود كائنات حية لأنها جاءت في الأصل من النباتات والحيوانات.","img":"","a":false},{"t":"tf","q":"التكيف الجسدي هو تغير يطرأ على سلوك الكائن الحي أو طريقة معيشته لمساعدته على البقاء في بيئته.","img":"","a":false},{"t":"tf","q":"تُصنف العناكب ضمن مجموعة الحشرات نظراً لتشابه أشكالها وطريقة معيشتهما في الطبيعة.","img":"","a":false},{"t":"tf","q":"يلجأ ثعلب الفنك إلى الاختباء نهاراً في الجحور والنشاط ليلاً للتغلب على شدة حرارة الشمس في الصحراء.","img":"","a":true},{"t":"tf","q":"تمتلك أوراق نبات السنط مساحة عريضة وكبيرة لامتصاص أكبر كمية ممكنة من مياه الأمطار.","img":"","a":false},{"t":"tf","q":"يستخدم اليربوع أرجله الأمامية الطويلة للقفز لمسافات طويلة وتجنب ملامسة الأراضي الساخنة.","img":"","a":false},{"t":"tf","q":"عند فحص جسم متحرك باستعمال العدسة المكبرة، يُكتفى بتحريك الوجه بالكامل مع العدسة للأمام والخلف.","img":"","a":false},{"t":"tf","q":"تساهم حشرة الجعران (خنفساء الروث) في زيادة خصوبة التربة الصحراوية وتغذية النباتات.","img":"","a":true},{"t":"tf","q":"تستطيع الضفادع التكيف والعيش بشكل طبيعي إذا نُقلت إلى البيئة الصحراوية الجافة.","img":"","a":false},{"t":"tf","q":"تُعتبر التربة من العناصر غير الحية الهامة التي توفر الغذاء والمأوى للعديد من الكائنات الحية.","img":"","a":true},{"t":"tf","q":"تستعين حشرة الجعران بضوء النجوم ومجرة درب التبانة لتحديد اتجاه حركتها ليلاً.","img":"","a":true},{"t":"tf","q":"من احتياطات السلامة عند استعمال العدسة المكبرة النظر من خلالها مباشرة إلى الشمس لفحص الضوء.","img":"","a":false},{"t":"tf","q":"يستطيع الجمل تخزين كميات كبيرة من المياه والدهون داخل جسمه مما يساعده على البقاء بدون ماء لفترات طويلة.","img":"","a":true},{"t":"tf","q":"تبدأ خطوات تصنيف الكائنات الحية بالبحث عن أوجه الاختلاف بين الكائنات قبل الملاحظة.","img":"","a":false},{"t":"tf","q":"تعتمد السحالي الصحراوية في حصولها على الماء بشكل أساسي على الماء الموجود في غذائها.","img":"","a":true},{"t":"tf","q":"تُعتبر نباتات اللوتس والبردي من النباتات ذات التكيفات الخاصة للعيش في البيئات الصحراوية شديدة الجفاف.","img":"","a":false},{"t":"tf","q":"يساعد التكيف الكائنات الحية على البقاء في مواطنها والحماية من الانقراض عند تغير الظروف البيئية.","img":"","a":true},{"t":"tf","q":"يتطلب التوثيق العلمي الصحيح لبطاقة تسجيل الملاحظات كتابة اسم الشخص الذي قام بالفحص وتاريخه.","img":"","a":true},{"t":"tf","q":"تمتلك أفراد أشجار السنط جذوراً قصيرة وسطحية لامتصاص قطرات الندى القريبة من سطح الأرض.","img":"","a":false},{"t":"tf","q":"تتشابه جميع الكائنات الحية في صفاتها وأشكالها مما يجعل عملية تصنيفها غير ذات أهمية للعلماء.","img":"","a":false},{"t":"tf","q":"يُعتبر وجود الفرو الكثيف في باطن قدم ثعلب الفنك تكيفاً سلوكياً لحمايته من الرمال الساخنة.","img":"","a":false},{"t":"tf","q":"تُصنّف التربة والماء والهواء ضمن مجموعة الكائنات الحية نظراً لأهميتها الضرورية لبقاء الحياة على الأرض.","img":"","a":false}]},{"title":"السؤال الثاني","instr":"اختر الإجابة الصحيحة من بين الإجابات المعطاة","items":[{"t":"mcq","q":"ما السبب الرئيسي لتواجد بعض الحيوانات كالعقارب والسحالي أسفل الصخور وفي الشقوق الصحراوية؟","img":"","o":["امتصاص حرارة الصخور الساخنة في منتصف النهار","تناول الأوراق النباتية الكثيفة النامية تحتها","البحث عن الضوء الساطع لتنشيط الحركة","التواجد في أماكن رطبة وباردة بعيداً عن حرارة الشمس"],"c":[3]},{"t":"mcq","q":"عند فحص كائن حي مثبت على جذع شجرة باستخدام العدسة المكبرة، كيف يجب أن يتحرك الباحث للحصول على صورة واضحة؟","img":"","o":["يمسك العدسة بالقرب من عينيه ويحرك وجهه والعدسة معاً للأمام والخلف","يبعد العدسة أقصى مسافة ممكنة عن عينيه ووجهه","ينظر عبر العدسة باتجاه أشعة الشمس المباشرة","يحرك جذع الشجرة للأمام والخلف مع تثبيت العدسة"],"c":[0]},{"t":"mcq","q":"ما القاعدة الصحيحة التي يجب اتباعها عند إعداد الرسم التوضيحي في بطاقة تسجيل الملاحظة العلمية؟","img":"","o":["تظليل الرسم بالكامل لإعطائه شكلاً جمالياً","إضافة أجزاء متخيلة للكائن لم تظهر بالعدسة المكبرة","استخدام الخطوط السميكة جداً لإخفاء العيوب","رسم الكائن بخطوط رفيعة وواضحة دون استخدام التظليل"],"c":[3]},{"t":"mcq","q":"أي من الحيوانات التالية يمتلك ثماني أرجل فقط وينتمي لمجموعة الكائنات التي تُصنف حسب الشكل بناءً على الأرجل؟","img":"","o":["العنكبوت","الجراد","الفراشة","السحلية"],"c":[0]},{"t":"mcq","q":"كيف يتكيف نبات السنط جثمانياً للعيش في البيئة الصحراوية الجافة؟","img":"","o":["تنمو جذوره على سطح التربة فقط لامتصاص الندى","يمتلك أوراقاً عريضة وكبيرة لامتصاص أكبر قدر من الماء","يمتلك أوراقاً صغيرة جداً وجذوراً تمتد عميقاً تحت الأرض","يتخلى عن الجذور تماماً ويعتمد على امتصاص الرطوبة من الهواء"],"c":[2]},{"t":"mcq","q":"ما الذي يساعد ثعلب الفنك على تحمل السير على الرمال الساخنة في الصحراء؟","img":"","o":["وجود فرو كثيف في باطن قدميه","امتلاكه حوافر عريضة مغطاة بالجلد الميت","طول الأرجل الخلفية التي تمنحه القدرة على القفز","كبر حجم الأذنين اللتين تفرزان السوائل"],"c":[0]},{"t":"mcq","q":"ما الفائدة التكيفية للأرجل الخلفية الطويلة لدى اليربوع الصحراوي؟","img":"","o":["تساعده على القفز السريع وتقليل زمن ملامسة الأقدام للرمال الساخنة","تستخدم لتخزين المياه والدهون للفترات الجافة","تساعده على تسلق أشجار السنط للحصول على الغذاء","تمكنه من حفر الجحور العميقة في التربة الطينية"],"c":[0]},{"t":"mcq","q":"أي من الكائنات التالية يُصنف ضمن الحيوانات التي تتخذ من ضفاف نهر النيل والأراضي الزراعية موطناً طبيعياً لها؟","img":"","o":["اليربوع وشجرة السنط","الكوبرا المصرية والحنظل","قط الرمال وثعلب الفنك","طائر أبو قردان والضفدع"],"c":[3]},{"t":"mcq","q":"لماذا لا يستطيع الضفدع الانتقال والعيش في البيئة الصحراوية الجافة؟","img":"","o":["بسبب كبر حجم جسمه الذي يعيقه عن الحركة في الرمال","لأن أذنيه الكبيرة تتأثر بالرمال المتحركة","لعدم توفر أشعة الشمس الكافية في البيئة الصحراوية","لأنه يحتاج إلى بيئة رطبة ومياه وفيرة ولا يستطيع جسمه التكيف مع الجفاف"],"c":[3]},{"t":"mcq","q":"تعتمد بعض حيوانات الصحراء التي لا تشرب الماء إلا نادراً على الحصول على احتياجاتها من الماء عن طريق:","img":"","o":["الانتقال يومياً إلى نهر النيل للشرب ثم العودة","استخلاص الماء الموجود في الغذاء الذي تتناوله","تخزين مياه الأمطار في تجاويف خاصة في جلدها","امتصاص بخار الماء من الهواء عبر الفرء"],"c":[1]},{"t":"mcq","q":"ما الدور البيئي الهام الذي تقوم به حشرة الجعران (خنفساء الروت) في البيئة الصحراوية؟","img":"","o":["توفير مصدر مياه رئيساً للحيوانات المفترسة","تغذية النباتات الصحراوية العريضة بأوراقها","تجميع روث الحيوانات ودفنه في التربة مما يربك خصوبتها ويحد من انتشار الأمراض","منع وصول أشعة الشمس إلى جحور الحيوانات الصحراوية"],"c":[2]},{"t":"mcq","q":"كيف تستدل حشرة الجعران على طريقها وتحرك كرات الروث في خط مستقيم أثناء الليل؟","img":"","o":["تتتبع خطوط الظلال التي تخلقها الصخور الصحراوية","تتبع الأصوات الصادرة من جحور الحيوانات الأخرى","تستعين بضوء مجرة درب التبانة والنجوم في السماء","تعتمد على حاسة الشم القوية لرائحة المياه القريبة"],"c":[2]},{"t":"mcq","q":"عند تصنيف الكائنات الحية بناءً على اللون، أيٌّ من المجموعات التالية تضم كائنات ذات ألوان متعددة (عديدة الألوان)؟","img":"","o":["النسر والكوبرا المصرية","الفراشة وزهرة اللوتس","العنكبوت والنمل","الجراد والنباتات الخضراء"],"c":[1]},{"t":"mcq","q":"أيُّ التكيفات التالية يُعتبر تكيفاً سلوكياً للحيوانات الصحراوية للهروب من حرارة النهار؟","img":"", ","q":"ما السبب الرئيسي لكتابة التاريخ واسم الفاحص في بطاقة تسجيل الملاحظات؟","img":"","o":["لأن العدسة المكبرة لا تعمل إلا بوجود هذه البيانات","لتغيير لون وشكل الكائن الحي المراد دراسته","لتحديد كمية الغذاء التي يستهلكها الكائن","لتوثيق عملية الفحص العلمي ودقتها"],"c":[3]},{"t":"mcq","q":"عند إعداد رسم توضيحي لكائن حي في بطاقة الملاحظات، كيف يجب أن تكون الخطوط المستخدمة؟","img":"","o":["باستخدام ألوان قاتمة لتغطية جميع المفاصيل","برسوم عشوائية لا تعبر عن الشكل الواقعي","بخطوط رفيعة وواضحة وغير مظللة","بخطوط سميكة ومظللة بالكامل باللون الأسود"],"c":[2]},{"t":"mcq","q":"لماذا يُوصى بعدم تظليل الرسوم التوضيحية العلمية للكائنات الحية؟","img":"","o":["لأن التظليل قد يغير لون أو شكل الكائن ويخفي الأجزاء المهمة","لأن الكائنات الحية تتأثر سلباً بالتظليل وتغير موطنها","لأن التظليل يستهلك وقتاً طويلاً أثناء استخدام العدسة","لأن التظليل يزيد من حجم الكائن الحي بشكل غير طبيعي"],"c":[0]},{"t":"mcq","q":"ما المقصود بمفهوم 'تصنيف الكائنات الحية'؟","img":"","o":["نقل الكائنات الحية من مواطنها الطبيعية إلى بيئات صناعية","إلغاء الفروق بين الحيوانات والنباتات لجعلها مجموعة واحدة","تقسيم الكائنات الحية إلى مجموعات حسب أوجه التشابه والاختلاف بينها","تجميع الأشياء غير الحية فقط في مجموعات حسب الحجم"],"c":[2]},{"t":"mcq","q":"لماذا لا يُعد العنكبوت من مجموعة الحشرات رغم تشابهه الظاهري مع بعضها؟","img":"","o":["لأنه لا يستطيع العيش في الجحور أو بين الشقوق","لأن له 8 أرجل بينما الحشرات لها 6 أرجل","لأنه كائن غير حي يفتقر لخصائص النمو","لأن جسمه يفتقر تماماً إلى الألوان المفردة"],"c":[1]},{"t":"mcq","q":"ما التعريف العلمي الصحيح لـ 'التكيف'؟","img":"","o":["عملية تحويل الكائنات الحية إلى أشياء غير حية لحمايتها","انتقال الكائن الحي المفاجئ للعيش في بيئة غير مناسبة له ليموت فيها","قدرة الكائن الحي على الاستغناء التام عن الماء والهواء","تغير في تركيب جسم الكائن الحي أو سلوكه يساعده على البقاء في بيئته"],"c":[3]},{"t":"mcq","q":"تتميز بيئة ضفاف نهر النيل في مصر بعدة خصائص مناخية وبيئية، منها:","img":"","o":["وفرة المياه، التربة الرطبة، والحرارة المعتدلة","النعام الندرة الشديدة للمياه والتربة الجافة شديدة الحرارة","عدم وجود أي نوع من الطيور المائية أو الحيوانات","الارتفاع الشديد في التأثير المباشر لأشعة الشمس لعدم وجود نباتات"],"c":[0]},{"t":"mcq","q":"لماذا تعيش حيوانات مثل الضفادع وطائر أبو قردان بكثرة في بيئة ضفاف نهر النيل؟","img":"","o":["لأن أوراقها تشبه الريشة لتقليل فقد الماء","لأنها تحتاج إلى الماء بكميات كبيرة لترطيب أجسامها والتغذية","لتجنب التفاعل مع الكائنات الحية الأخرى","لأنها تستطيع الاختباء في جحور الصحراء الحارة نهاراً"],"c":[1]},{"t":"mcq","q":"كيف تساعد الأوراق الصغيرة التي تشبه الريشة نبات السنط على العيش في الصحراء؟","img":"","o":["لامتصاص أكبر كمية من مياه الأمطار الغزيرة","لتوفير الظل للحيوانات الضخمة كالجمل فقط","لتخزين الأكسجين داخل الجذور","لتقليل فقد الماء في البيئة الجافة"],"c":[3]},{"t":"mcq","q":"أي مما يلي يُعد مثالاً على 'التكيف السلوكي' في الحيوانات الصحراوية؟","img":"","o":["امتلاك ثعلب الفنك أذنان كبيرتان لتبريد الجسم","الفرو الكثيف في باطن قدم ثعلب الفنك","اختباء ثعلب الفنك واليربوع في الجحور نهاراً","وجود أقدام خلفية طويلة لدى اليربوع للقفز"],"c":[2]},{"t":"mcq","q":"كيف يساهم التكيف الجسدي المتمثل في 'الأذنين الكبيرتين' في بقاء ثعلب الفنك بالصحراء؟","img":"","o":["فقد الحرارة الزائدة لتبريد الجسم وتجميع الأصوات البعيدة","حماية باطن القدم من حرارة الرمال الساخنة","مساعدته على القفز لمسافات طويلة كالكنغر","تخزين الفائض من المياه داخل الأذن لاستخدامه عند العطش"],"c":[0]},{"t":"mcq","q":"ما الفائدة الرئيسية لـ 'الفرو الكثيف في باطن القدم' لثعلب الفنك؟","img":"","o":["يزيد من سرعة طيرانه بين الأشجار الكثيفة","يجعله ينشط نهاراً تحت أشعة الشمس الحرارة","يعمل كعازل حراري يحمي القدمين من حرارة الرمال الساخنة","يساعده على امتصاص الماء المباشر من التربة الجافة"],"c":[2]},{"t":"mcq","q":"يمتلك اليربوع أرcols خلفية طويلة تساعده جسدياً على:","img":"","o":["تبريد الأذن الكبيرة عن طريق ضخ الدماء إليها","القفز لمسافات طويلة وتقليل زمن تلامس أقدامه مع الرمال الساخنة","حفر الجحور العملاقة أثناء ساعات الليل فقط","التغذية المباشرة على أوراق الأشجار العالية كأشجار السنط"],"c":[1]},{"t":"mcq","q":"ما النتيجة المتوقعة إذا تم نقل ضفدع من بيئة ضفاف نهر النيل ليعيش في البيئة الصحراوية؟","img":"","o":["ستقل حاجته للماء ويتغذى على الرمال الساخنة","سيتكيف فوراً وتنمو له أذنان كبيرتان للعيش في الجحور","سيموت الضفدع لعدم توافر الماء الوفير اللازم لترطيب جسمه","سيتحول أصله إلى مادة غير حية كالصخور فوراً"],"c":[2]},{"t":"mcq","q":"قارن بين ثعلب الفنك (صحراوي) وثعلب الغابة/الأحمر من حيث طول الأذن، ما السبب في كون أذن ثعلب الغابة أقل طولاً؟","img":"","o":["لأنه يعيش في بيئة معتدلة ولا يحتاج لتبريد جسمه أو فقد الحرارة الكثيفة","لأن ثعلب الغابة يتغذى فقط على النباتات غير الحية","لأن ثعلب الغابة لا يمتلك حاسة سمع على الإطلاق","لأن أذنيه تستخدمان في القفز لمسافات طويلة كاليربوع"],"c":[0]},{"t":"mcq","q":"كيف تحصل سحالي الصحراء على الماء اللازم لبقائها على قيد الحياة رغم ندرة الشرب المباشر؟","img":"","o":["تعتمد على الماء الموجود في غذائها من الكائنات والنباتات","تقوم بتحويل الهواء إلى مياه داخل أذنيها الكبيرة","تشرب كميات هائلة من مياه النيل دفعة واحدة نهاراً","تتوقف تماماً عن استهلاك أي نسبة من رطوبة الماء"],"c":[0]}]},{"title":"السؤال الثالث","instr":"أكمل ما يأتي","items":[{"t":"fill","q":"المكان الطبيعي الذي يعيش فيه الكائن الحي وتتوافر فيه المياه والغذاء للتكيف والبقاء يسمى __________.","img":"","a":["الموطن الطبيعي"],"o":["المسار الهجري","الموطن الطبيعي","المأوى المؤقت","النظام الصناعي"]},{"t":"fill","q":"تجميع الكائنات الحية التي تشترك في صفات متشابهة مثل الشكل أو اللون في مجموعات يُعرف بـ __________.","img":"","a":["التصنيف"],"o":["التصنيف","التكيف","التنفس","التطور"]},{"t":"fill","q":"يحصل حيوان اليربوع على معظم احتياجاته من الماء في البيئة الصحراوية القاسية عن طريق __________.","img":"","a":["غذائه النباتي"],"o":["غذائه النباتي","الشرب من الأنهار","تخزين الأمطار في جحره","امتصاص بخار الهواء"]},{"t":"fill","q":"تتميز البيئة على ضفاف نهر النيل بالتربة الرطبة والمياه __________.","img":"","a":["الوفيرة"],"o":["المالحة","القليلة جداً","الوفيرة","المنعدمة"]},{"t":"fill","q":"تمتلك نباتات مثل السنط والحنظل أوراقاً صغيرة لمنع فقدان __________.","img":"","a":["الماء"],"o":["الماء","الضوء","الأكسجين","التربة"]},{"t":"fill","q":"تتميز النباتات الشوكية مثل 'التين الشوكي' بـ __________.","img":"","a":["جذور تمتد تحت الأرض للحصول على الماء وأوراق تحورت إلى أشواك"],"o":["جذور تمتد تحت الأرض للحصول على الماء وأوراق تحورت إلى أشواك","أوراق عريضة غنية بالماء للعيش داخل المستنقعات","ساق ضعيفة غير قادرة على تخزين الماء","عدم حاجتها المطلقة لأي كمية من الماء أو الضوء"]},{"t":"fill","q":"تُعد زيادة النشاط ليلاً والاختباء نهاراً في الجحور الباردة لدى كائنات الصحراء مثالاً على التكيف...","img":"","a":["السلوكي (طرق معيشة ذكية)"],"o":["البيئي المائي","التنفسي عن طريق الرئتين","التركيبي في شكل الأذن","السلوكي (طرق معيشة ذكية)"]}]}]},norm);</script></body></html>
