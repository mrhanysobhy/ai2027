    <script>window.PAGE_DATA = {"type":"review","subjectId":"computer-basics","subject":{"id":"computer-basics","name":"مبادئ الحاسب الآلي","icon":"fa-desktop","gradient":"linear-gradient(135deg, #1565c0 0%, #42a5f5 100%)","description":"تعلم أساسيات الحاسب الآلي ومكوناته وأنظمة التشغيل"},"lessonId":1,"lesson":{"id":1,"title":"مقدمة في الحاسب الآلي","explanation":{"content":"<h2>مبادئ الحاسب الآلي</h2>\n<div class=\"info-box\">\n    <p>تعرّف في هذا الدرس على الحاسب الآلي: تعريفه، نبذة تاريخية، أنواع أجهزته، ومكوناته المادية والمعنوية، بالإضافة إلى أبرز الوظائف في هذا المجال.</p>\n</div>\n\n<h3>أولاً: مقدمة عن الحاسب الآلي</h3>\n<p>أصبح الحاسب الآلي جزءًا أساسيًا من حياتنا اليومية؛ فهو يدخل في كل مجالات العمل والدراسة، من إدارة المؤسسات وحفظ البيانات إلى التواصل والبحث عن المعرفة. ولهذا فإن التعامل مع الحاسب الآلي ومعرفة مبادئه الأساسية لم تعد ترفًا، بل ضرورة يحتاجها كل طالب ليواكب متطلبات سوق العمل الحديث.</p>\n<p>في هذا الدرس، سنتعرف خطوة بخطوة على الحاسب الآلي: ما هو؟ وكيف تطور عبر التاريخ؟ وما أنواع أجهزته؟ وما الفرق بين مكوناته المادية (Hardware) ومكوناته المعنوية (Software)؟ وصولًا إلى أبرز الوظائف التي يحتاجها هذا المجال.</p>\n<div class=\"info-box\">\n    <p><strong>هدف الدرس:</strong> بنهاية هذا الدرس، ستكون قادرًا على التمييز بين مكونات الحاسب الآلي المختلفة، والتعامل بثقة مع برنامجي معالجة الكلمات Word والجداول الحسابية Excel.</p>\n</div>\n\n<h3>ثانياً: نبذة تاريخية عن الحاسب الآلي</h3>\n<p>لم يظهر الحاسب الآلي كما نعرفه اليوم دفعة واحدة، بل مرّ بمراحل تطور متتالية امتدت لعقود، بدءًا من الحاسبات الضخمة البطيئة، وصولًا إلى الأجهزة الشخصية السريعة التي نستخدمها الآن.</p>\n<table>\n    <tr><th>الفترة</th><th>أهم التطورات</th></tr>\n    <tr><td>منتصف الأربعينيات</td><td>ظهرت أولى الحاسبات الإلكترونية الضخمة التي كانت تشغل غرفًا كاملة، وتعتمد على الصمامات المفرغة، وكانت بطيئة جدًا مقارنة بمعايير اليوم، ومخصصة بالأساس لإجراء العمليات الحسابية المعقدة.</td></tr>\n    <tr><td>الخمسينيات والستينيات</td><td>انتشرت الحاسبات الرئيسية الكبيرة (Main Frame) في المؤسسات والهيئات الحكومية والمالية الكبرى، ثم ظهرت الدوائر المتكاملة (Integrated Circuits) التي ساهمت في تصغير حجم الأجهزة وزيادة سرعتها.</td></tr>\n    <tr><td>مطلع السبعينيات</td><td>ظهر أول معالج دقيق (Microprocessor) يجمع وحدات المعالجة في شريحة واحدة صغيرة، وكان ذلك نقطة تحول مهّدت لظهور فكرة الحاسب الشخصي.</td></tr>\n    <tr><td>الثمانينيات وما بعدها</td><td>انتشرت الحاسبات الشخصية (PC) بأسعار في متناول الأفراد والمؤسسات الصغيرة، ثم تطورت لاحقًا الحاسبات المحمولة (Laptop)، لتصبح المعالجة الرقمية جزءًا من كل بيت ومكتب.</td></tr>\n</table>\n\n<h3>ثالثاً: تعريف الحاسب الآلي</h3>\n<div class=\"info-box\">\n    <p><strong>الحاسب الآلي (Computer):</strong> جهاز إلكتروني يستقبل كمًّا هائلًا من البيانات (Data)، ويقوم بمعالجتها وتخزينها، واستخراجها منظّمة ومفيدة، وفق برنامج مُعَدّ مسبقًا (Pre-Programmed).</p>\n</div>\n<p>يتميز الحاسب الآلي بالسرعة الفائقة في إنجاز العمليات، والقدرة على تخزين كميات ضخمة من المعلومات، والدقة في تنفيذ التعليمات دون كلل، وهو ما يجعله أداة لا غنى عنها في كل مجالات العمل.</p>\n<h3>الفرق بين البيانات والمعلومات</h3>\n<table>\n    <tr><th>البيانات Data</th><th>المعلومات Information</th></tr>\n    <tr><td>حقائق وأرقام ونصوص خام غير منظمة، لا تحمل بذاتها معنى واضحًا للمستخدم.</td><td>نتاج معالجة البيانات وتنظيمها وربطها ببعضها، لتصبح ذات معنى ومفيدة في اتخاذ القرار.</td></tr>\n    <tr><td>مثال: أسماء الطلاب، ودرجاتهم قبل تجميعها.</td><td>مثال: متوسط درجات الفصل.</td></tr>\n</table>\n\n<h3>رابعاً: أنواع أجهزة الحاسب الآلي</h3>\n<p>تختلف أجهزة الحاسب الآلي في الحجم والقدرة على المعالجة ومجال الاستخدام، ويمكن تقسيمها إلى أربعة أنواع رئيسية:</p>\n<table>\n    <tr><th>النوع</th><th>الوصف</th></tr>\n    <tr><td>الحاسبات الفائقة Super Computers</td><td>حاسبات قوية جدًا ومكلفة، لها قدرة هائلة على معالجة مليارات التعليمات في لحظة واحدة. تستخدمها الهيئات العسكرية والمجالات العلمية والهندسية، مثل توقع حالة الطقس ووكالات الفضاء.</td></tr>\n    <tr><td>الحاسبات الرئيسية Main Frame</td><td>ظهرت في فترة الخمسينيات، وتحتل عادة غرفة كاملة مجهزة بتكييف خاص. تستخدمها المؤسسات والهيئات الكبرى متعددة الفروع كالهيئات الحكومية والمالية، وتُستخدم أيضًا كخوادم للمواقع Web Servers.</td></tr>\n    <tr><td>الحاسبات الشخصية Personal Computers</td><td>بدأ ظهورها في بداية الثمانينيات، وهي الحاسبات المنتشرة استخدامًا حاليًا، برخص ثمنها وصغر حجمها، ويمكن ربطها معًا عبر شبكة لتقارب قدرتها قدرات الحاسبات الأكبر.</td></tr>\n    <tr><td>الحاسبات المحمولة Laptop / Notebook</td><td>تتميز بقدرتها الكبيرة على معالجة البيانات رغم صغر حجمها الذي لا يزيد كثيرًا عن حجم ورقة A4، وسهولة حملها والتنقل بها، وتعمل بطاقة بطارية قابلة لإعادة الشحن.</td></tr>\n</table>\n\n<h3>خامساً: المكونات المادية Hardware</h3>\n<p>تتكون المكونات المادية الملموسة للحاسب الآلي من أربع وحدات رئيسية تعمل معًا بشكل متكامل:</p>\n\n<h3>١. وحدات الإدخال Input Units</h3>\n<p>هي الوسيلة التي يتم من خلالها إدخال البيانات والتعليمات إلى الحاسب الآلي، ومن أشهرها:</p>\n<table>\n    <tr><th>الجهاز</th><th>الوظيفة المختصرة</th></tr>\n    <tr><td>لوحة المفاتيح Keyboard</td><td>إدخال النصوص والأوامر</td></tr>\n    <tr><td>الفأرة Mouse</td><td>التأشير والتحكم في عناصر الشاشة</td></tr>\n    <tr><td>الماسح الضوئي Scanner</td><td>تحويل الصور والمستندات الورقية إلى صيغة رقمية</td></tr>\n    <tr><td>الكاميرا الرقمية</td><td>إدخال الصور ومقاطع الفيديو</td></tr>\n    <tr><td>الميكروفون</td><td>إدخال الصوت</td></tr>\n</table>\n\n<h3>٢. وحدة المعالجة المركزية C.P.U.</h3>\n<p>وهي «عقل» الحاسب الآلي، وتتولى تنفيذ العمليات الحسابية والمنطقية، والتحكم في تدفق البيانات والمعلومات، وتتكون من جزأين رئيسيين:</p>\n<ul>\n    <li><strong>المعالج:</strong> ويضم وحدة التحكم Control Unit (تدير وتنسق تنفيذ التعليمات)، ووحدة الحساب والمنطق Arithmetic &amp; Logic Unit (تُجري العمليات الحسابية والمقارنات المنطقية).</li>\n    <li><strong>الذاكرة الأساسية:</strong> وتضم ذاكرة الوصول العشوائي RAM (مؤقتة، تُفقد بياناتها عند انقطاع الكهرباء)، وذاكرة القراءة فقط ROM (دائمة لا تتأثر بانقطاع الكهرباء)، والذاكرة المؤقتة Cache Memory (لتسريع الوصول للبيانات الأكثر استخدامًا).</li>\n</ul>\n\n<h3>٣. وحدات الإخراج Output Units</h3>\n<p>تعرض نتائج معالجة البيانات، إما في صورة مرئية Softcopy عبر الشاشة، أو في صورة مطبوعة Hardcopy عبر الطابعة، ومن أشهرها:</p>\n<table>\n    <tr><th>الجهاز</th><th>نوع الإخراج</th></tr>\n    <tr><td>الشاشة Screen</td><td>Softcopy — عرض مؤقت على الشاشة</td></tr>\n    <tr><td>الطابعة Printer</td><td>Hardcopy — نسخة ورقية دائمة</td></tr>\n    <tr><td>السماعات</td><td>Softcopy — إخراج صوتي</td></tr>\n</table>\n\n<h3>٤. وحدات التخزين الثانوية Secondary Storage Units</h3>\n<p>تُستخدم لتخزين البيانات والمعلومات بصورة دائمة للرجوع إليها عند الحاجة، مثل: القرص الصلب Harddisk، والقرص المدمج CD/DVD، والفلاش ميموري Flash Memory.</p>\n<div class=\"warning-box\">\n    <strong>لاحظ:</strong>\n    <p>لا يمكن أن يعمل الحاسب الآلي بالهاردوير Hardware بدون وجود برامج تشغّله (Software)، كما لا يمكن للبرامج أن تعمل بدون جهاز (Hardware) يستقبلها وينفذها. فكل منهما يكمّل الآخر.</p>\n</div>\n\n<h3>سادساً: المكونات المعنوية Software</h3>\n<p>البرامج هي مجموعة من التعليمات المكتوبة بلغة يفهمها الحاسب، لتؤدي وظيفة معينة، وتنقسم إلى نوعين رئيسيين:</p>\n<h3>أولاً: برامج النظم System Programs</h3>\n<p>وأهمها <strong>نظام التشغيل (Operating System)</strong>، وهو الذي يتوسط بين المستخدم والأجهزة، ويتحكم في جميع موارد الحاسب المتاحة، مثل إدارة الذاكرة، والتحكم في وحدات الإدخال والإخراج، وتشغيل البرامج والملفات. من أشهر أمثلته: Windows و Mac OS و Linux.</p>\n<table>\n    <tr><td><strong>النواة Kernel</strong></td><td>الجزء المسؤول عن التواصل المباشر مع المكونات المادية؛ فهو يتحكم في معالج الحاسب ويدير كتابة وقراءة البيانات في الذاكرة، وينظم عملية استقبال البيانات وإخراجها عبر الأجهزة الملحقة كالشاشة ولوحة المفاتيح.</td></tr>\n    <tr><td><strong>واجهة المستخدم User Interface</strong></td><td>هي الوسيلة التي يتفاعل بها المستخدم مع الجهاز، مثل سطح المكتب والأيقونات والنوافذ، أو واجهة الأوامر النصية (Command Prompt / Terminal).</td></tr>\n</table>\n<h3>ثانيًا: برامج التطبيقات Application Programs</h3>\n<p>هي برامج تُكتب لخدمة المستخدم في أداء مهام معينة، ويمكن تشغيلها بعد تشغيل نظام التشغيل، وتنقسم إلى نوعين:</p>\n<table>\n    <tr><th>النوع</th><th>الوصف</th><th>أمثلة</th></tr>\n    <tr><td>لأغراض عامة General Purpose</td><td>برامج يستخدمها كل الأشخاص لأغراض عامة كالمعتاد في العمل المكتبي</td><td>Microsoft Word, Excel, PowerPoint</td></tr>\n    <tr><td>لأغراض خاصة Special Purpose</td><td>برامج مصممة خصيصًا لخدمة قطاع أو شركة بعينها</td><td>برامج إدارة الأموال والمرتبات</td></tr>\n</table>\n\n<h3>سابعاً: اختصاصات الوظائف في مجال الحاسب IT Specialists</h3>\n<p>لا يمكن للحاسب الآلي أن يعمل من تلقاء نفسه؛ بل يحتاج إلى فريق من المتخصصين الذين يصممونه ويطوّرونه ويحافظون عليه. من أبرز هذه الوظائف:</p>\n<ul>\n    <li><strong>مطوّر برامج:</strong> يُنشئ برامج جديدة تناسب احتياجات المستخدمين، ويطوّرها ويختبرها بالكامل.</li>\n    <li><strong>مسؤول قاعدة بيانات:</strong> يتولى تنظيم البيانات وحمايتها والتحقق من صحتها، ونسخها احتياطيًا.</li>\n    <li><strong>مهندس أجهزة الكمبيوتر:</strong> مسؤول عن تصميم وتصنيع وصيانة مكونات الحاسب المادية كاللوحات والذاكرة.</li>\n    <li><strong>مدير نظم الكمبيوتر:</strong> يدير نظام الحاسب في المؤسسة ويجري التحديثات اللازمة على الأجهزة والبرامج.</li>\n    <li><strong>مهندس شبكات الكمبيوتر:</strong> يصمم وينفذ شبكات اتصال البيانات المحلية والخارجية ويحافظ عليها.</li>\n    <li><strong>مطوّر ويب:</strong> يبني البنية الأساسية لمواقع الإنترنت باستخدام برمجيات متخصصة.</li>\n    <li><strong>محلل أمن المعلومات:</strong> يحمي شبكات المعلومات من الاختراقات والهجمات الإلكترونية.</li>\n    <li><strong>مبرمج كمبيوتر:</strong> يترجم تصميم البرنامج إلى أكواد برمجية قابلة للتنفيذ على الجهاز.</li>\n    <li><strong>مدير أنظمة المعلومات:</strong> يواكب المؤسسة مع أحدث التقنيات ويشرف على تنفيذ نظم البيانات.</li>\n    <li><strong>مدير المشروع:</strong> يقود فريق العمل من المبرمجين والمحللين ويحدد نطاق ومتطلبات المشروع.</li>\n    <li><strong>مدخل بيانات:</strong> يقوم بإدخال البيانات إلى قواعد بيانات إلكترونية وفق برامج محددة.</li>\n    <li><strong>مستخدم الحاسب:</strong> المستخدم النهائي لبرامج التطبيقات، كإدخال البيانات واستخراج النتائج.</li>\n</ul>"},"review":{"questions":[{"type":"truefalse","question":"الحاسب الآلي جهاز إلكتروني يستقبل البيانات ويعالجها وفق برنامج مُعَدّ مسبقًا.","correct":true,"explanation":"هذا هو التعريف الدقيق للحاسب الآلي؛ فهو يعمل وفق تعليمات مُبرمَجة مسبقًا (Pre-Programmed) لمعالجة البيانات وإنتاج معلومات مفيدة."},{"type":"truefalse","question":"البيانات والمعلومات مترادفان، ولا فرق بينهما.","correct":false,"explanation":"البيانات هي حقائق خام غير منظمة لا تحمل معنى مباشرًا، أما المعلومات فهي نتاج معالجة البيانات وتنظيمها لتصبح ذات معنى ومفيدة."},{"type":"truefalse","question":"تُستخدم الحاسبات الفائقة (Super Computers) غالبًا من قِبل الأفراد في المنازل.","correct":false,"explanation":"الحاسبات الفائقة مكلفة جدًا وتُستخدم من قبل الهيئات العسكرية والعلمية، مثل توقع حالة الطقس، وليس في الاستخدام المنزلي الفردي."},{"type":"truefalse","question":"تتميز الحاسبات المحمولة (Laptop) بعملها بطاقة بطارية قابلة لإعادة الشحن.","correct":true,"explanation":"هذه من أبرز خصائص الحاسبات المحمولة، فهي تعمل بالبطارية إلى جانب سهولة حملها وصغر حجمها."},{"type":"truefalse","question":"وحدة المعالجة المركزية (CPU) مسؤولة عن تنفيذ العمليات الحسابية والمنطقية.","correct":true,"explanation":"تضم وحدة المعالجة المركزية وحدة الحساب والمنطق (ALU) المسؤولة عن هذه العمليات، ووحدة التحكم التي تنسّق تنفيذها."},{"type":"truefalse","question":"نظام التشغيل يُعد أحد برامج التطبيقات Application Programs.","correct":false,"explanation":"نظام التشغيل هو أهم مثال على برامج النظم System Programs، وليس من برامج التطبيقات التي تخدم المستخدم في مهام محددة كالكتابة أو الحسابات."},{"type":"mcq","question":"أي مما يلي يُعد من وحدات الإدخال؟","options":["الطابعة","الماسح الضوئي","الشاشة","السماعات"],"correct":1,"explanation":"الماسح الضوئي (Scanner) يُدخل الصور والمستندات إلى الحاسب، بينما الطابعة والشاشة والسماعات من وحدات الإخراج."},{"type":"mcq","question":"ما وظيفة وحدة التحكم (Control Unit) داخل المعالج؟","options":["تخزين البيانات بشكل دائم","توجيه وتنسيق تنفيذ العمليات داخل الحاسب","طباعة النتائج","الاتصال بشبكة الإنترنت"],"correct":1,"explanation":"وحدة التحكم مسؤولة عن توجيه وتنسيق سير تنفيذ التعليمات بين أجزاء الحاسب المختلفة."},{"type":"mcq","question":"أي أنواع الذاكرة التالية يفقد محتواه عند انقطاع التيار الكهربائي؟","options":["ROM","القرص الصلب","RAM","الفلاش ميموري"],"correct":2,"explanation":"ذاكرة الوصول العشوائي RAM ذاكرة مؤقتة تفقد بياناتها بمجرد انقطاع الكهرباء، على عكس ROM وأجهزة التخزين الثانوية."},{"type":"mcq","question":"أي مما يلي مثال على برامج تطبيقات لأغراض عامة؟","options":["نظام التشغيل Windows","Microsoft Word","النواة Kernel","تعريفات الطابعة"],"correct":1,"explanation":"برنامج Word مثال على برامج التطبيقات العامة General Purpose التي يستخدمها معظم الناس، أما Windows والنواة فمن برامج النظم."},{"type":"mcq","question":"من المسؤول عن تصميم وتنفيذ وصيانة شبكات الحاسب واتصال البيانات؟","options":["مطوّر برامج","محلل أمن المعلومات","مهندس شبكات الكمبيوتر","مدخل بيانات"],"correct":2,"explanation":"مهندس شبكات الكمبيوتر هو المتخصص في تصميم وتنفيذ وصيانة شبكات اتصال البيانات المحلية والخارجية."},{"type":"mcq","question":"أي أنواع الحاسبات التالية تحتل عادةً غرفة كاملة مجهزة بتكييف خاص، وتُستخدم في المؤسسات الكبرى؟","options":["الحاسبات الشخصية","الحاسبات المحمولة","الحاسبات الرئيسية Main Frame","الآلات الحاسبة"],"correct":2,"explanation":"الحاسبات الرئيسية (Main Frame) تحتل غرفة كاملة مجهزة بتكييف خاص، وتستخدمها المؤسسات الحكومية والمالية الكبرى."},{"type":"complete","question":"المكونات المادية الملموسة للحاسب الآلي تسمى ________.","answer":"الهاردوير (Hardware)"},{"type":"complete","question":"البرامج التي تُدير موارد الحاسب وتتوسط بين المستخدم والأجهزة تسمى ________.","answer":"نظام التشغيل (Operating System)"},{"type":"complete","question":"الجزء من نظام التشغيل الذي يتعامل مباشرة مع المكونات المادية ويدير الذاكرة يسمى ________.","answer":"النواة (Kernel)"},{"type":"complete","question":"الوحدات التي تُستخدم لتخزين البيانات بصورة دائمة للرجوع إليها عند الحاجة تسمى وحدات ________.","answer":"التخزين الثانوية (Secondary Storage)"}]},"practiceExam":{"questions":[{"question":"أي العبارات التالية صحيحة عن الحاسبات الشخصية PC مقارنة بالحاسبات الفائقة؟","options":["أكبر حجمًا وأغلى ثمنًا","أصغر حجمًا وأقل تكلفة","لا فرق بينهما","تستخدم في وكالات الفضاء فقط"],"correct":1},{"question":"ما الاختصار الذي يشير إلى وحدة المعالجة المركزية؟","options":["HTTP","CPU","RAM","USB"],"correct":1},{"question":"أي مما يلي من وحدات الإخراج؟","options":["الماسح الضوئي","لوحة المفاتيح","الطابعة","الميكروفون"],"correct":2},{"question":"من المسؤول عن إنشاء برامج جديدة تناسب احتياجات المستخدمين؟","options":["مسؤول قاعدة بيانات","مطوّر برامج","مهندس أجهزة","مدير مشروع"],"correct":1},{"question":"أي أنواع الذاكرة يُستخدم لتسريع الوصول إلى البيانات الأكثر استخدامًا؟","options":["الذاكرة المؤقتة Cache","ROM","القرص الصلب","الفلاش ميموري"],"correct":0},{"question":"متى بدأ ظهور الحاسبات الشخصية (PC) تقريبًا؟","options":["الأربعينيات","الخمسينيات","الثمانينيات","بعد عام 2020"],"correct":2},{"question":"الوحدات المسؤولة عن إدخال البيانات إلى الحاسب مثل لوحة المفاتيح والماوس تُسمى وحدات:","options":["الإخراج","الإدخال","التخزين الثانوية","المعالجة"],"correct":1},{"question":"ذاكرة ROM تُعد من الذاكرة:","options":["المؤقتة التي تفقد بياناتها","الدائمة التي لا تتأثر بانقطاع الكهرباء","خصوصًا للطباعة","للتخزين الخارجي"],"correct":1},{"question":"التعليمات المكتوبة بلغة يفهمها الحاسب لتأدية وظيفة معينة تُسمى:","options":["مكونات مادية","برمجيات Software","وحدات إدخال","وحدات تخزين"],"correct":1},{"question":"أي مما يلي من برامج النظم System Programs؟","options":["Microsoft Word","Microsoft Excel","نظام التشغيل Windows","PowerPoint"],"correct":2}]},"finalExam":{"examId":"2026-2027-1","availableFrom":"2026-09-23T14:00","availableTo":"2026-09-23T20:00","duration":360,"passScore":60,"questions":[{"question":"في أي عام تم اختراع أول كمبيوتر رقمي من قبل العالم هوارد ايكن؟","options":["عام 1960","عام 1944","عام 1971","عام 1963"],"correct":1,"hint":"ابحث عن التاريخ المرتبط بأول جهاز ضخم وصل ارتفاعه إلى 2.5 متر."},{"question":"تعتبر البيانات (Data) هي:","options":["النتائج النهائية بعد معالجة الحقائق.","البرامج التي تدير موارد الجهاز المادية.","المادة الخام التي لم يتم معالجتها بعد.","الأجهزة الملموسة مثل الشاشة ولوحة المفاتيح."],"correct":2,"hint":"فكر في الشيء الذي يمثل \"المادة الخام\" قبل دخولها مرحلة المعالجة."},{"question":"أي من أنواع الحاسبات التالية يستخدم عادة كخوادم للمواقع (Web Servers) وفي المؤسسات الكبيرة؟","options":["الحاسبات العملاقة (Super Computers)","الحاسبات المحمولة (Laptop)","الحاسبات الشخصية (Personal Computers)","الحاسبات الرئيسية (Mainframe Computers)"],"correct":3,"hint":"تذكر النوع الذي يحتل عادة غرفة كاملة ومجهز بتكييف خاص."},{"question":"تتكون وحدة المعالجة المركزية (C.P.U) من جزأين رئيسيين هما:","options":["وحدة التحكم ووحدة الحساب والمنطق.","وحدة الإدخال ووحدة الإخراج.","وحدة التخزين الثانوية واللوحة الأم.","الذاكرة العشوائية وذاكرة القراءة فقط."],"correct":0,"hint":"أحدهما مسؤول عن الإدارة والآخر عن العمليات الحسابية."},{"question":"ما هو المكون الذي يعتبر 'النواة' (Kernel) في نظام التشغيل؟","options":["لوحة المفاتيح والماوس عند اتصالهما بالجهاز.","الواجهة الرسومية التي يراها المستخدم على الشاشة.","الجزء الأساسي الذي يتحكم في معظم العمليات عبر الجهاز.","مجموعة البرامج التطبيقية مثل Word و Excel."],"correct":2,"hint":"إنه الجزء المسؤول عن قراءة وكتابة البيانات في الذاكرة وتوجيه الأوامر."},{"question":"أي من الوظائف التالية مسؤول عن تصميم وتطوير واختبار مكونات الكمبيوتر المادية مثل اللوحات والدوائر؟","options":["مطور البرامج","مسؤول قاعدة البيانات","محلل نظم الكمبيوتر","مهندس أجهزة الكمبيوتر"],"correct":3,"hint":"الشخص الذي يتعامل مع الأجهزة الملموسة والرقاقات الإلكترونية."},{"question":"تعتبر شاشة اللمس (Touch Screen) من وحدات:","options":["التخزين فقط.","الإدخال فقط.","الإدخال والإخراج معاً.","المعالجة فقط."],"correct":2,"hint":"فكر في جهاز يؤدي وظيفتين: استقبال الأوامر وعرض النتائج."},{"question":"البرامج التي تُعد خصيصاً لشركة معينة بناءً على طلبها مثل برامج حجز تذاكر الطيران تسمى:","options":["برامج تطبيقات لأغراض خاصة.","نظم تشغيل (Operating Systems).","برامج النظم (System Programs).","برامج تطبيقات لأغراض عامة."],"correct":0,"hint":"هذا النوع من البرامج يسمى أحياناً \"حسب الطلب\"."},{"question":"صح أم خطأ: يمكن للحاسب الآلي (Hardware) أن يعمل بكفاءة دون الحاجة إلى أي برمجيات (Software).","options":["صح","خطأ"],"correct":1,"hint":"تذكر العلاقة التكاملية بين الجهاز والروح التي تديره."},{"question":"أي من المكونات التالية يعتبر وسيلة تخزين ثانوية دائمة؟","options":["وحدة الحساب والمنطق (ALU)","الذاكرة العشوائية (RAM)","لوحة المفاتيح (Keyboard)","الأقراص الصلبة (Hard disk)"],"correct":3,"hint":"ابحث عن المكون الذي يحفظ الملفات والبرامج لفترات طويلة."},{"question":"وظيفة 'مدخل البيانات' (Data Entry) تتطلب بالضرورة دراية كافية بتشغيل البرامج البرمجية المعقدة.","options":["خطأ","صح"],"correct":0,"hint":"راجع تعريف مدخل البيانات في قائمة التخصصات الوظيفية."},{"question":"النتائج التي تخرج من الطابعة على ورق تسمى بـ:","options":["برامج النظام (System Software)","البيانات الخام (Data)","النسخة المرئية (Softcopy)","النسخة الملموسة (Hardcopy)"],"correct":3,"hint":"إنه شيء يمكنك مسكه بيدك بعد عملية الطباعة."},{"question":"أي مما يلي يعد من أمثلة نظم التشغيل (Operating Systems)؟","options":["Microsoft Word","Microsoft Excel","Linux","LibreOffice"],"correct":2,"hint":"ابحث عن البرنامج الذي يعتبر البيئة الأساسية التي تعمل عليها باقي التطبيقات."},{"question":"المسؤول عن حماية شبكات المعلومات ومواقع الويب من الهجمات السيبرانية هو:","options":["محلل أمن المعلومات","مبرمج كمبيوتر","مدير المشروع","مطور الويب"],"correct":0,"hint":"دوره يشبه دور \"الحارس الرقمي\" للمعلومات والشبكات."},{"question":"ظهر الميكروبروسيسور (المعالج الدقيق) لأول مرة في عام 1971 م بفضل إحدى الشركات:","options":["الصينية","الأمريكية","اليابانية","الأوروبية"],"correct":1,"hint":"حدد جنسية الشركات التي قامت بتنفيذ أول معالج دقيق على شريحة سليكون."},{"question":"صح أم خطأ: المعلومات (Information) هي نفسها البيانات (Data) ولا يوجد فرق حقيقي بينهما.","options":["خطأ","صح"],"correct":0,"hint":"تذكر أن أحدهما يحتاج إلى \"معالجة\" ليتحول إلى الآخر."},{"question":"تتميز الحاسبات المحمولة (Laptop) بأنها تعمل على طاقة:","optio
