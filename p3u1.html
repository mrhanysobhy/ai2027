<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الوحدة الاولي رياضيات الصف الثالث الاعدادي</title><style>:root{--bg:#e8ebe5;--card:#fff;--ink:#1b2a27;--mut:#66746f;--line:#d6dbd3;--ac:#0e6b5b;--onac:#fff;--ok:#1e8e5a;--okb:#e3f4ea;--no:#c0392b;--nob:#fbeae7}@media(prefers-color-scheme:dark){:root{--bg:#12171a;--card:#1c2326;--ink:#e6ece9;--mut:#93a19c;--line:#2c3538;--ac:#2fa08c;--onac:#08201c;--ok:#3ec28a;--okb:#14301f;--no:#ef7b6c;--nob:#33191a}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 "Cairo","Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}main{max-width:820px;margin:0 auto;padding:0 14px 60px}.hd{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;text-align:center}.hd h1{margin:0;font-size:1.5em}.hd h2{margin:0;font-size:1em;font-weight:600;color:var(--mut)}.bar{height:8px;background:var(--line);border-radius:6px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}.meta{font-size:.8em;color:var(--mut)}section h3{margin:22px 0 8px;font-size:1.05em;color:var(--ac)}.qc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}.qc.ok{border-inline-start:6px solid var(--ok)}.qc.no{border-inline-start:6px solid var(--no)}.qt{font-weight:700}.qimg{display:block;max-width:100%;max-height:260px;margin:8px auto;object-fit:contain}.bl{display:inline-block;min-width:90px;border-bottom:2px dotted var(--ink)}.chs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.ch{font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 16px;cursor:pointer}.ch:hover:not(:disabled){border-color:var(--ac)}.ch.sel{border-color:var(--ac);background:var(--okb)}.ch.good{border-color:var(--ok);background:var(--okb)}.ch.bad{border-color:var(--no);background:var(--nob)}.ch:disabled{cursor:default}.tx,select{font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:6px 10px}.tx{width:100%;margin-top:10px}.mt{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-top:10px}.mt1{margin-top:10px}.mr{display:flex;gap:10px;align-items:center;margin-bottom:6px}.btn{font:inherit;border:2px solid var(--ac);background:none;color:var(--ac);border-radius:10px;padding:5px 18px;cursor:pointer;margin-top:10px;font-weight:700}.btn.pri{background:var(--ac);color:var(--onac)}.fb{margin-top:8px;font-weight:700}.qc.ok .fb{color:var(--ok)}.qc.no .fb{color:var(--no)}.qc .fb.info{color:var(--mut)}.res{text-align:center;background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:18px;margin-top:18px}.pc{font-size:2.4em;font-weight:800;color:var(--ac)}.mh{font-size:.8em;color:var(--mut);margin-top:2px}@media(max-width:560px){.mt{grid-template-columns:1fr}}[hidden]{display:none!important}:root{--wr:#d98a1a}@media(prefers-color-scheme:dark){:root{--wr:#f0b429}}.hrow{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}.tm{font-weight:800;font-variant-numeric:tabular-nums;background:var(--card);border:2px solid var(--ac);color:var(--ac);border-radius:20px;padding:0 14px;font-size:1.05em}.tm.low{border-color:var(--no);color:var(--no);background:var(--nob);animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.55}}.nv{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;margin-top:4px;scrollbar-width:thin}.nb{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85em;font-weight:700;cursor:pointer;padding:0 6px}.nb:disabled{cursor:default;opacity:.8}span.nb{cursor:default}.nb.an{background:var(--ac);border-color:var(--ac);color:var(--onac)}.nb.ok{background:var(--ok);border-color:var(--ok);color:#fff}.nb.no{background:var(--no);border-color:var(--no);color:#fff}.nb.fg{border-color:var(--wr);box-shadow:inset 0 -4px 0 var(--wr)}.nb.cur{outline:3px solid var(--ink);outline-offset:1px}.tmo{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--nob);border:2px solid var(--no);color:var(--no);border-radius:12px;padding:10px 14px;margin:8px 0;font-weight:700}.sl-h{font-size:.85em;color:var(--ac);font-weight:700;margin-bottom:6px}.sn{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);padding:10px 0;margin-top:10px}.pos{font-weight:700;color:var(--mut)}.btn:disabled{opacity:.45;cursor:default}.fl{font:inherit;font-size:.8em;border:1px dashed var(--line);background:none;color:var(--mut);border-radius:8px;padding:2px 10px;cursor:pointer;margin-top:10px;margin-inline-start:8px}.fl.on{border:1px solid var(--wr);color:var(--wr);font-weight:700}.fl:disabled{opacity:.5;cursor:default}.rvw h2{margin:0 0 8px}.rvw p{margin:10px 0 4px}.rvw .nv{flex-wrap:wrap;justify-content:center;overflow:visible}.rvw .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}</style></head><body><main id="app"></main><script>var norm=function norm(s){
  return String(s).replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[^\u0600-\u06FFa-zA-Z0-9\s]|_/g,' ').replace(/[\u060C\u061B\u061F]/g,' ').replace(/\s+/g,' ').trim();
};(function quizRuntime(D,norm){
  var LET=['أ','ب','ج','د','هـ','و'],DIG='٠١٢٣٤٥٦٧٨٩',BL=/(\.{3,}|…+|_{3,})/g;
  var app=document.getElementById('app'),base=[],secOf=[],items=[],layout=[],S=[],plan=null;
  var slides=!!D.slides,cur=0,end=0,left=0,timer=null,finished=false,locked=false,reviewing=false;
  D.sections.forEach(function(s,si){s.items.forEach(function(q){base.push(q);secOf.push(si);});});
  function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
  var KEY='quiz-'+hash(JSON.stringify(D));
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\uE000/g,'<sup>').replace(/\uE001/g,'</sup>').replace(/\uE002/g,'<sub>').replace(/\uE003/g,'</sub>');}
  function num(n){var s=String(n);return D.hindi?s.replace(/\d/g,function(d){return DIG[d];}):s;}
  function sels(i){return [].slice.call(document.querySelectorAll('#q'+i+' select'));}
  function hasOpts(q){return !!(q.o&&q.o.length);}
  function canBack(){return !slides||D.back!==false||finished;}
  function canFlag(){return !slides||D.back!==false;}

  /* ---------- الخلط في كل محاولة ---------- */
  function rnd(n){return Math.floor(Math.random()*n);}
  function idn(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a;}
  function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function newPlan(){
    var ord=D.sections.map(function(s,si){var ids=[];secOf.forEach(function(x,g){if(x===si)ids.push(g);});return D.shuf?shuf(ids):ids;});
    var p={};
    if(D.shuf)base.forEach(function(q,g){
      var n=(q.t==='mcq'||q.t==='multi'||(q.t==='fill'&&hasOpts(q)))?q.o.length:q.t==='match'?q.r.length:q.t==='order'?q.it.length:0;
      if(n>1)p[g]=shuf(idn(n));
    });
    return {ord:ord,p:p};
  }
  function view(g,p){
    var q=base[g],o={};for(var k in q)o[k]=q[k];
    if(!p)return o;
    if(hasOpts(q)&&(q.t==='mcq'||q.t==='multi'||q.t==='fill')){
      o.o=p.map(function(j){return q.o[j];});
      if(q.c)o.c=q.c.map(function(old){return p.indexOf(old);});
    }else if(q.t==='match'){
      o.r=p.map(function(j){return q.r[j];});
      o.c=q.c.map(function(old){return p.indexOf(old);});
    }else if(q.t==='order'){
      o.it=p.map(function(j){return q.it[j];});
      o.c=p.map(function(j){return q.c[j];});
    }
    return o;
  }
  function build(){
    items=[];layout=[];
    plan.ord.forEach(function(ids,si){
      var row=[];
      ids.forEach(function(g){var v=view(g,plan.p[g]);v.si=si;row.push(items.length);items.push(v);});
      layout.push(row);
    });
  }

  /* ---------- الرسم ---------- */
  function card(q,i,k){
    var h='<div class="qc" id="q'+i+'" data-i="'+i+'">';
    if(slides)h+='<div class="sl-h">'+esc(D.sections[q.si].title)+': '+esc(D.sections[q.si].instr)+'</div>';
    h+='<div class="qt"><b>'+num(k)+'-</b> '+(q.t==='fill'?esc(q.q).replace(BL,'<span class="bl"></span>'):esc(q.q))+'</div>';
    if(q.img)h+='<img class="qimg" alt="" src="'+esc(q.img)+'">';
    if(q.t==='multi')h+='<div class="mh">اختر كل الإجابات الصحيحة</div>';
    if(q.t==='tf')h+='<div class="chs"><button type="button" class="ch" data-v="1">✓ صواب</button><button type="button" class="ch" data-v="0">✗ خطأ</button></div>';
    else if(q.t==='mcq'||q.t==='multi'||(q.t==='fill'&&hasOpts(q)))h+='<div class="chs">'+q.o.map(function(o,j){return '<button type="button" class="ch" data-v="'+j+'">'+(q.t!=='fill'?'<b>'+LET[j]+'</b> ':'')+esc(o)+'</button>';}).join('')+'</div>';
    else if(q.t==='fill')h+='<input class="tx" type="text" autocomplete="off" placeholder="اكتب إجابتك">';
    else if(q.t==='essay')h+='<textarea class="tx" rows="4" placeholder="اكتب إجابتك"></textarea>'+(q.a?'<button type="button" class="btn rv">عرض الإجابة النموذجية</button>':'');
    else if(q.t==='match')h+='<div class="mt"><div>'+q.l.map(function(x,j){return '<div class="mr"><span>'+num(j+1)+'- '+esc(x)+'</span><select data-j="'+j+'"><option value="">—</option>'+q.r.map(function(_,m){return '<option value="'+m+'">'+LET[m]+'</option>';}).join('')+'</select></div>';}).join('')+'</div><div>'+q.r.map(function(x,m){return '<div>'+LET[m]+'- '+esc(x)+'</div>';}).join('')+'</div></div>';
    else if(q.t==='order')h+='<div class="mt1">'+q.it.map(function(x,j){return '<div class="mr"><select data-j="'+j+'"><option value="">—</option>'+q.it.map(function(_,m){return '<option value="'+m+'">'+num(m+1)+'</option>';}).join('')+'</select><span>'+esc(x)+'</span></div>';}).join('')+'</div>';
    if(D.instant&&(q.t==='match'||q.t==='order'||q.t==='multi'||(q.t==='fill'&&!hasOpts(q))))h+='<button type="button" class="btn ck">تحقق</button>';
    if(canFlag())h+='<button type="button" class="fl">🚩 راجع لاحقاً</button>';
    return h+'<div class="fb" aria-live="polite"></div></div>';
  }
  function render(){
    var h='<header class="hd"><div class="hrow"><h1>'+esc(D.title||'اختبار تفاعلي')+'</h1><span class="tm" id="tm" hidden></span></div>'+(D.grade?'<h2>'+esc(D.grade)+'</h2>':'')+
      '<div class="bar"><i id="pb"></i></div><div class="meta" id="meta"></div><nav class="nv" id="nv" aria-label="أسئلة الاختبار">'+
      items.map(function(_,i){return '<button type="button" class="nb" data-go="'+i+'" aria-label="سؤال '+(i+1)+'">'+num(i+1)+'</button>';}).join('')+'</nav></header>'+
      '<div class="tmo" id="tmo" hidden><span>⏰ انتهى الوقت وتم قفل الأسئلة</span><button type="button" class="btn pri" id="shr">عرض النتيجة</button></div>'+
      '<div class="res" id="res" hidden></div><div class="res rvw" id="rev" hidden></div><div id="qs">';
    layout.forEach(function(row,si){
      var s=D.sections[si];
      if(!slides)h+='<section><h3>'+esc(s.title)+': '+esc(s.instr)+'</h3>';
      row.forEach(function(i,k){h+=card(items[i],i,k+1);});
      if(!slides)h+='</section>';
    });
    h+='</div>';
    if(slides)h+='<div class="sn" id="sn"><button type="button" class="btn" id="pv">→ السابق</button><span class="pos" id="pos"></span><button type="button" class="btn pri" id="nx">التالي ←</button></div>';
    else h+='<div id="fw" style="text-align:center"><button type="button" class="btn pri" id="fin">إنهاء ومراجعة</button></div>';
    app.innerHTML=h;
  }
  function chrome(){
    $('rev').hidden=!reviewing;$('qs').hidden=reviewing;
    var sn=$('sn'),fw=$('fw');
    if(sn)sn.hidden=reviewing;
    if(fw)fw.hidden=reviewing||locked||finished;
    $('tmo').hidden=!(locked&&!finished);
  }

  /* ---------- الحالة ---------- */
  function answered(i){
    var q=items[i];
    if(q.t==='match'||q.t==='order')return sels(i).every(function(e){return e.value!=='';});
    if(q.t==='essay'||(q.t==='fill'&&!hasOpts(q))){var e=document.querySelector('#q'+i+' .tx');return !!e&&e.value.trim()!=='';}
    return S[i].v!==null;
  }
  function updNav(){
    var nv=$('nv');if(!nv)return;
    var bs=nv.children,lock=slides&&!canBack();
    for(var i=0;i<bs.length;i++){
      var s=S[i],cl='nb';
      if(finished&&s.ok===true)cl+=' ok';
      else if(finished&&s.ok===false)cl+=' no';
      else if(s.done||answered(i))cl+=' an';
      if(s.flag)cl+=' fg';
      if(slides&&i===cur)cl+=' cur';
      bs[i].className=cl;bs[i].disabled=lock;
    }
    if(slides&&bs[cur]&&bs[cur].scrollIntoView)bs[cur].scrollIntoView({block:'nearest',inline:'nearest'});
  }
  function refresh(){
    var a=0,ok=0,g=0;
    items.forEach(function(q,i){
      if(S[i].done||answered(i))a++;
      if(S[i].done&&q.t!=='essay'){g++;if(S[i].ok)ok++;}
    });
    $('pb').style.width=Math.round(a/items.length*100)+'%';
    $('meta').textContent='أجبت عن '+num(a)+' من '+num(items.length)+(D.instant&&g?' — الدرجة الحالية: '+num(ok)+' / '+num(g):'');
    updNav();
  }
  function show(i){
    cur=i;
    if(slides){
      items.forEach(function(q,k){var c=$('q'+k);if(c)c.hidden=(k!==i);});
      var last=i===items.length-1;
      $('pos').textContent=num(i+1)+' / '+num(items.length);
      $('pv').disabled=i===0||!canBack();
      $('nx').textContent=(last&&!finished&&!locked)?'إنهاء ومراجعة':'التالي ←';
      $('nx').disabled=last&&(finished||locked);
    }
    updNav();
  }
  function go(i){
    if(i<0||i>=items.length)return;
    if(slides){if(i<cur&&!canBack())return;show(i);window.scrollTo(0,0);save();}
    else{cur=i;var c=$('q'+i);if(c&&c.scrollIntoView)c.scrollIntoView({behavior:'smooth',block:'center'});updNav();}
  }
  function step(d,fromKey){
    var n=cur+d;
    if(n<0||(d<0&&!canBack()))return;
    if(n>=items.length){if(!fromKey&&!finished&&!locked)openRev();return;}
    show(n);window.scrollTo(0,0);save();
  }

  /* ---------- التصحيح ---------- */
  function grade(i){
    var s=S[i],q=items[i],c=$('q'+i),fb=c.querySelector('.fb'),ok=false,ans='';
    if(s.done)return;s.done=true;
    var sv=sels(i).map(function(e){return e.value;});
    if(q.t==='tf'){ok=s.v!==null&&(s.v===1)===q.a;ans=q.a?'صواب':'خطأ';}
    else if(q.t==='mcq'){ok=s.v!==null&&q.c.indexOf(s.v)>-1;ans=q.c.map(function(j){return q.o[j];}).join(' / ');}
    else if(q.t==='multi'){
      var pk=(s.v||[]).slice().sort(),cr=q.c.slice().sort();
      ok=pk.length===cr.length&&pk.every(function(x,k){return x===cr[k];});
      ans=q.c.map(function(j){return q.o[j];}).join(' / ');
    }
    else if(q.t==='fill'){
      var v=hasOpts(q)?(s.v===null?'':q.o[s.v]):c.querySelector('.tx').value,nv=norm(v);
      ok=!!nv&&q.a.some(function(a){return norm(a)===nv;});ans=q.a.join(' / ');
    }else if(q.t==='match'){
      ok=sv.every(function(x,j){return x===String(q.c[j]);});
      ans=q.c.map(function(m,j){return num(j+1)+'←'+LET[m];}).join('، ');
    }else if(q.t==='order'){
      ok=sv.every(function(x,j){return x===String(q.c[j]);});
      var arr=[];q.c.forEach(function(p,j){arr[p]=q.it[j];});ans=arr.join(' ← ');
    }else ans=q.a||'';
    s.ok=q.t==='essay'?null:ok;
    [].forEach.call(c.querySelectorAll('.ch'),function(b){
      var j=+b.getAttribute('data-v'),good;
      if(q.t==='tf')good=(j===1)===q.a;
      else if(q.t==='mcq'||q.t==='multi')good=q.c.indexOf(j)>-1;
      else good=q.a.some(function(a){return norm(a)===norm(q.o[j]);});
      if(good)b.classList.add('good');else if(Array.isArray(s.v)?s.v.indexOf(j)>-1:s.v===j)b.classList.add('bad');
    });
    [].forEach.call(c.querySelectorAll('input,textarea,select,button.ch,button.ck,button.rv,button.fl'),function(e){e.disabled=true;});
    if(q.t==='essay'){fb.className='fb info';fb.innerHTML=ans?'الإجابة النموذجية: '+esc(ans):'تم تسجيل إجابتك (سؤال مقالي لا يُصحَّح آلياً)';}
    else{c.classList.add(ok?'ok':'no');fb.innerHTML=ok?'✓ إجابة صحيحة':'✗ إجابة غير صحيحة — الصحيح: '+esc(ans);}
    refresh();
  }

  /* ---------- المؤقت والقفل ---------- */
  function fmt(s){var m=Math.floor(s/60),r=s%60;return num((m<10?'0':'')+m)+':'+num((r<10?'0':'')+r);}
  function startTimer(){
    clearInterval(timer);
    var tm=$('tm');
    if(!(D.mins>0)){tm.hidden=true;return;}
    tm.hidden=false;
    end=Date.now()+left*1000;
    function tick(){
      left=Math.max(0,Math.round((end-Date.now())/1000));
      tm.textContent='⏱ '+fmt(left);
      tm.classList.toggle('low',left<=60);
      if(left<=0){clearInterval(timer);lockAll();}
      else if(left%5===0)save();
    }
    tick();timer=setInterval(tick,1000);
  }
  function lockAll(){
    if(locked||finished)return;
    locked=true;reviewing=false;
    [].forEach.call(app.querySelectorAll('.qc input,.qc textarea,.qc select,.qc button.ch,.qc button.ck,.qc button.rv,.qc button.fl'),function(e){e.disabled=true;});
    chrome();show(cur);save();
  }

  /* ---------- المراجعة قبل التسليم ---------- */
  function openRev(){
    if(locked||finished)return;
    var un=[],fl=[],jump=canBack();
    items.forEach(function(q,i){if(!(S[i].done||answered(i)))un.push(i);if(S[i].flag)fl.push(i);});
    function chips(a){return '<div class="nv">'+a.map(function(i){return jump?'<button type="button" class="nb" data-go="'+i+'">'+num(i+1)+'</button>':'<span class="nb">'+num(i+1)+'</span>';}).join('')+'</div>';}
    var h='<h2>مراجعة قبل التسليم</h2>';
    h+=un.length?'<p>⚠ عندك <b>'+num(un.length)+'</b> سؤال بدون إجابة:</p>'+chips(un):'<p>✓ أجبت عن كل الأسئلة.</p>';
    if(fl.length)h+='<p>🚩 أسئلة وضعت عليها علامة «راجع لاحقاً» (<b>'+num(fl.length)+'</b>):</p>'+chips(fl);
    h+='<div class="acts"><button type="button" class="btn" id="rvb">العودة للأسئلة</button><button type="button" class="btn pri" id="sub">تسليم وعرض النتيجة</button></div>';
    $('rev').innerHTML=h;reviewing=true;chrome();window.scrollTo(0,0);
  }
  function closeRev(i){reviewing=false;chrome();if(typeof i==='number')go(i);else show(cur);}

  function finish(){
    if(finished)return;
    finished=true;locked=false;reviewing=false;clearInterval(timer);
    items.forEach(function(q,i){grade(i);});
    var tot=0,ok=0;
    items.forEach(function(q,i){if(q.t!=='essay'){tot++;if(S[i].ok)ok++;}});
    var p=tot?Math.round(ok/tot*100):0,r=$('res');
    r.innerHTML='<h2>النتيجة: '+num(ok)+' من '+num(tot)+'</h2><div class="pc">'+num(p)+'%</div><p>'+(p>=85?'ممتاز! 🌟':p>=65?'جيد جداً 👏':p>=50?'جيد، يمكنك التحسّن 💪':'حاول مرة أخرى 📘')+'</p>'+(D.retry!==false?'<button type="button" class="btn" id="again">إعادة الاختبار</button>':'');
    r.hidden=false;
    [].forEach.call(app.querySelectorAll('.fl'),function(b){b.disabled=true;});
    clearSaved();chrome();show(cur);refresh();
    if(r.scrollIntoView)r.scrollIntoView({behavior:'smooth',block:'center'});
  }

  /* ---------- حفظ التقدم ---------- */
  function tval(i){
    var q=items[i],c=$('q'+i);
    if(q.t==='match'||q.t==='order')return sels(i).map(function(e){return e.value;});
    var e=c.querySelector('.tx');return e?e.value:null;
  }
  function save(){
    if(!D.save||finished||!items.length)return;
    try{
      var st=items.map(function(q,i){return {v:S[i].v,d:S[i].done?1:0,f:S[i].flag?1:0,t:tval(i)};});
      localStorage.setItem(KEY,JSON.stringify({plan:plan,st:st,left:left,cur:cur}));
    }catch(e){}
  }
  function load(){try{var j=localStorage.getItem(KEY);return j?JSON.parse(j):null;}catch(e){return null;}}
  function clearSaved(){try{localStorage.removeItem(KEY);}catch(e){}}
  function apply(sv){
    /* st مرتبة بترتيب العرض نفسه الذي حُفظت به الخطة */
    sv.st.forEach(function(x,i){
      var s=S[i],q=items[i],c=$('q'+i);
      if(!c)return;
      s.v=x.v;s.flag=!!x.f;
      if(x.t!=null){
        if(q.t==='match'||q.t==='order'){sels(i).forEach(function(e,j){if(x.t[j]!=null)e.value=x.t[j];});}
        else{var e=c.querySelector('.tx');if(e)e.value=x.t;}
      }
      [].forEach.call(c.querySelectorAll('.ch'),function(b){
        var j=+b.getAttribute('data-v');
        if(Array.isArray(s.v)?s.v.indexOf(j)>-1:s.v===j)b.classList.add('sel');
      });
      var f=c.querySelector('.fl');
      if(f&&s.flag){f.classList.add('on');f.textContent='🚩 معلَّم للمراجعة';}
      if(x.d)grade(i);
    });
    cur=Math.max(0,Math.min(items.length-1,sv.cur|0));
  }

  function start(restore){
    clearInterval(timer);
    finished=false;locked=false;reviewing=false;cur=0;
    var sv=restore&&D.save?load():null;
    if(sv&&!(sv.plan&&sv.plan.ord&&sv.plan.ord.length===D.sections.length&&sv.st&&sv.st.length===base.length))sv=null;
    plan=sv?sv.plan:newPlan();
    build();
    S=items.map(function(){return {done:false,ok:null,v:null,flag:false};});
    left=D.mins>0?(sv&&typeof sv.left==='number'?sv.left:Math.round(D.mins*60)):0;
    render();
    if(sv)apply(sv);
    chrome();show(cur);refresh();
    startTimer();
  }

    var c=t.closest('.qc');if(!c)return;
    var i=+c.getAttribute('data-i');
    if(t.classList.contains('fl')){

      S[i].flag=!S[i].flag;t.classList.toggle('on',S[i].flag);
      t.textContent=S[i].flag?'🚩 معلَّم للمراجعة':'🚩 راجع لاحقاً';
      updNav();save();return;

    if(S[i].done||locked||finished)return;
    if(t.classList.contains('ch')&&items[i].t==='multi'){
      var mv=S[i].v||[],mj=+t.getAttribute('data-v'),mp=mv.indexOf(mj);

      S[i].v=mv.length?mv:null;refresh();save();
    }else if(t.classList.contains('ch')){
      [].forEach.call(c.querySelectorAll('.ch'),function(b){b.classList.remove('sel');});
      t.classList.add('sel');S[i].v=+t.getAttribute('data-v');
      if(D.instant)grade(i);else refresh();
      save();
    }else if(t.classList.contains('ck')||t.classList.contains('rv')){grade(i);save();}
  });
  function onEdit(){if(finished||!items.length)return;refresh();save();}
